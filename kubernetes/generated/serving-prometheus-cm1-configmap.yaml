apiVersion: v1
data:
  alerts.yml: |
    # Prometheus Alerting Rules for Movie Analytics Serving Layer

    groups:
      - name: serving_layer_alerts
        interval: 30s
        rules:
          # API Health Alerts
          - alert: APIDown
            expr: up{job="fastapi"} == 0
            for: 1m
            labels:
              severity: critical
              component: api
            annotations:
              summary: "FastAPI service is down"
              description: "FastAPI service has been down for more than 1 minute"

          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.01
            for: 5m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "High error rate detected"
              description: "API error rate is {{ $value | humanizePercentage }} (threshold: 1%)"

          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.1
            for: 5m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "High API latency detected"
              description: "95th percentile latency is {{ $value }}s (threshold: 100ms)"

          # MongoDB Alerts
          - alert: MongoDBDown
            expr: up{job="mongodb"} == 0
            for: 1m
            labels:
              severity: critical
              component: database
            annotations:
              summary: "MongoDB is down"
              description: "MongoDB exporter has been down for more than 1 minute"

          - alert: MongoDBHighConnections
            expr: mongodb_connections{state="current"} > 100
            for: 5m
            labels:
              severity: warning
              component: database
            annotations:
              summary: "High MongoDB connection count"
              description: "MongoDB has {{ $value }} active connections (threshold: 100)"

          # Redis Alerts
          - alert: RedisDown
            expr: up{job="redis"} == 0
            for: 1m
            labels:
              severity: warning
              component: cache
            annotations:
              summary: "Redis cache is down"
              description: "Redis exporter has been down for more than 1 minute"

          - alert: LowCacheHitRate
            expr: rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 0.7
            for: 10m
            labels:
              severity: info
              component: cache
            annotations:
              summary: "Low Redis cache hit rate"
              description: "Cache hit rate is {{ $value | humanizePercentage }} (threshold: 70%)"

          # Business Metrics Alerts (custom metrics from FastAPI)
          - alert: HighCrisisAlertRate
            expr: rate(crisis_alerts_total[1h]) > 5
            for: 10m
            labels:
              severity: info
              component: business
            annotations:
              summary: "High rate of PR crisis alerts"
              description: "{{ $value }} crisis alerts per hour detected"

          - alert: LowViralContentDetection
            expr: rate(viral_detections_total[1h]) < 1
            for: 30m
            labels:
              severity: info
              component: business
            annotations:
              summary: "Low viral content detection rate"
              description: "Only {{ $value }} viral movies detected in the last hour"
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: serving-prometheus
  name: serving-prometheus-cm1
