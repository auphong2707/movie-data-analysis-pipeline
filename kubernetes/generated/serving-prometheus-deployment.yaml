apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: serving-prometheus
  name: serving-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: serving-prometheus
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: serving-prometheus
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.console.libraries=/usr/share/prometheus/console_libraries
            - --web.console.templates=/usr/share/prometheus/consoles
            - --web.enable-lifecycle
          image: prom/prometheus:latest
          name: serving-prometheus
          ports:
            - containerPort: 9090
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/prometheus/prometheus.yml
              name: serving-prometheus-cm0
              subPath: prometheus.yml
            - mountPath: /etc/prometheus/alerts.yml
              name: serving-prometheus-cm1
              subPath: alerts.yml
            - mountPath: /prometheus
              name: serving-prometheus-data
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: prometheus.yml
                path: prometheus.yml
            name: serving-prometheus-cm0
          name: serving-prometheus-cm0
        - configMap:
            items:
              - key: alerts.yml
                path: alerts.yml
            name: serving-prometheus-cm1
          name: serving-prometheus-cm1
        - name: serving-prometheus-data
          persistentVolumeClaim:
            claimName: serving-prometheus-data
