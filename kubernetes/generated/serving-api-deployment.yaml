apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: serving-api
  name: serving-api
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: serving-api
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: serving-api
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: env
          image: auphong2707/movie-pipeline-serving-api:latest
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:8000/api/v1/health
            failureThreshold: 3
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
          name: serving-api
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - mountPath: /app/logs
              name: serving-api-claim1
      hostname: serving-api
      restartPolicy: Always
      volumes:
        - name: serving-api-claim1
          persistentVolumeClaim:
            claimName: serving-api-claim1
