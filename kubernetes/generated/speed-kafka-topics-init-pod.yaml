apiVersion: v1
kind: Pod
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: speed-kafka-topics-init
  name: speed-kafka-topics-init
spec:
  containers:
    - args:
        - python
        - kafka_producers/setup_topics.py
        - create
      envFrom:
        - configMapRef:
            name: env
      image: auphong2707/movie-pipeline-speed-layer:v2
      imagePullPolicy: Always
      name: speed-kafka-topics-init
  restartPolicy: OnFailure
