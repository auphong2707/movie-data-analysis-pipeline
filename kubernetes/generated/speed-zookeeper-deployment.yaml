apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: speed-zookeeper
  name: speed-zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: speed-zookeeper
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: speed-zookeeper
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - env:
            - name: ZOOKEEPER_4LW_COMMANDS_WHITELIST
              value: srvr,mntr,ruok,stat
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          image: confluentinc/cp-zookeeper:7.4.0
          livenessProbe:
            exec:
              command:
                - echo srvr | nc localhost 2181 || exit 1
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          name: speed-zookeeper
          ports:
            - containerPort: 2181
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/zookeeper/data
              name: speed-zookeeper-data
            - mountPath: /var/lib/zookeeper/log
              name: speed-zookeeper-logs
      hostname: zookeeper
      restartPolicy: Always
      volumes:
        - name: speed-zookeeper-data
          persistentVolumeClaim:
            claimName: speed-zookeeper-data
        - name: speed-zookeeper-logs
          persistentVolumeClaim:
            claimName: speed-zookeeper-logs
