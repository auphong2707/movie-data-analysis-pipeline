apiVersion: v1
data:
  prometheus.yml: |
    # Prometheus Configuration for Movie Analytics Serving Layer
    # Monitors FastAPI, MongoDB, and Redis infrastructure

    global:
      scrape_interval: 15s      # Scrape targets every 15 seconds
      evaluation_interval: 15s  # Evaluate rules every 15 seconds
      external_labels:
        cluster: 'serving-layer'
        environment: 'production'

    # Alertmanager configuration (optional - add later if needed)
    # alerting:
    #   alertmanagers:
    #     - static_configs:
    #         - targets: ['alertmanager:9093']

    # Load alerting rules
    rule_files:
      - 'alerts.yml'

    # Scrape configurations
    scrape_configs:
      # FastAPI application metrics
      - job_name: 'fastapi'
        static_configs:
          - targets: ['serving-api:8000']
        metrics_path: '/metrics'
        scrape_interval: 10s
        scrape_timeout: 5s

      # MongoDB metrics via mongodb_exporter
      - job_name: 'mongodb'
        static_configs:
          - targets: ['mongodb-exporter:9216']
        scrape_interval: 15s
        scrape_timeout: 10s

      # Redis metrics via redis_exporter
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
        scrape_interval: 15s
        scrape_timeout: 5s

      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: serving-prometheus
  name: serving-prometheus-cm0
