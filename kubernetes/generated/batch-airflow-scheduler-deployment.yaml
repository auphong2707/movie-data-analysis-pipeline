apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: batch-airflow-scheduler
  name: batch-airflow-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: batch-airflow-scheduler
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: batch-airflow-scheduler
    spec:
      containers:
        - args:
            - scheduler
          env:
            - name: PYTHONPATH
              value: /opt/airflow/spark_jobs
          envFrom:
            - configMapRef:
                name: env
          image: auphong2707/movie-pipeline-airflow:latest
          livenessProbe:
            exec:
              command:
                - airflow jobs check --job-type SchedulerJob
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 10
          name: batch-airflow-scheduler
          volumeMounts:
            - mountPath: /opt/airflow/spark_jobs
              name: batch-airflow-scheduler-cm1
            - mountPath: /opt/airflow/logs
              name: batch-airflow-logs
            - mountPath: /opt/airflow/.env
              name: batch-airflow-scheduler-cm3
              subPath: .env
      hostname: airflow-scheduler
      restartPolicy: Always
      volumes:
        - configMap:
            name: batch-airflow-scheduler-cm1
          name: batch-airflow-scheduler-cm1
        - name: batch-airflow-logs
          emptyDir: {}
        - configMap:
            items:
              - key: .env
                path: .env
            name: batch-airflow-scheduler-cm3
          name: batch-airflow-scheduler-cm3
