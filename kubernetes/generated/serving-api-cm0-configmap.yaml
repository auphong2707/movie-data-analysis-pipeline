    """
    Serving Layer package
    """

    __version__ = "1.0.0"
  API_DASHBOARD_REORGANIZATION_PLAN.md: "# API Routes & Dashboard Reorganization Plan\n\n**Date:** December 18, 2025  \n**Purpose:** Reorganize API routes and Grafana dashboards to align with three business goals\n\n---\n\n## \U0001F4CA Implementation Status\n\n### ✅ Completed (December 18, 2025)\n\n**Goal #2: Viral Detection Endpoints**\n- ✅ **2.4 `/viral-detection/opportunities`** - Marketing amplification opportunities\n  - Implementation: COMPLETE\n  - Testing: 12/12 tests passing\n  - Formula: O = V × (1 + urgency) - simplified from original 4-factor formula\n  - Calibration: Data-driven thresholds (top 5%/10%/25% percentiles)\n  - Action Distribution: 75% actionable recommendations (vs 4% before calibration)\n  - Status: **READY FOR PRODUCTION**\n\n**Goal #3: Content Recommendation Endpoints**\n- ✅ **TMDB Score Calibration** - Dual-success recommendation formula\n  - Dataset: 3,657 movies from production database\n  - Formula: `TMDB_Score = normalize(0.5*pop + 0.3*vote_avg*10 + 0.2*log10(vote_count))`\n  - Key Finding: Low correlation (-0.077) between popularity and vote_average\n  - Components: 50% current buzz + 30% quality + 20% credibility\n  - Documentation: `TMDB_SCORE_CALIBRATION.md`\n  - Status: **FORMULA DEFINED, READY FOR IMPLEMENTATION**\n\n### \U0001F6A7 In Progress\n\n**Goal #2: Viral Detection Endpoints**\n- \U0001F6A7 2.1 `/viral-detection/trending` - Planned\n- \U0001F6A7 2.2 `/viral-detection/movies/{id}/viral-score` - Planned\n- \U0001F6A7 2.3 `/viral-detection/thresholds` - Planned\n- \U0001F6A7 2.5 `/viral-detection/velocity/{id}` - Planned\n\n**Goal #1: Crisis Detection Endpoints**\n- \U0001F6A7 All endpoints - Planned\n\n**Goal #3: Content Recommendation Endpoints**\n- \U0001F6A7 All endpoints - Planned\n\n---\n\n## \U0001F3AF Business Goals\n\n### Goal #1: PR Crisis Detection\n- **Metric:** Sentiment deviation from baseline (3σ threshold)\n- **Users:** PR teams, marketing managers\n\n### Goal #2: Viral Content Identification\n- **Metric:** Viral coefficient (velocity / threshold)\n- **Users:** Marketing teams, social media managers\n\n### Goal #3: Content Recommendation\n- **Metric:** Dual-success score (60% Reddit + 40% TMDB)\n- **Users:** Content curators, product managers\n\n---\n\n## \U0001F4C1 New API Routes Structure\n\n```\n/api/v1/\n├── /health                          # System health checks\n│\n├── /crisis-detection/               # \U0001F6A8 GOAL #1: PR Crisis Detection\n│   ├── /movies/{id}/sentiment       # Sentiment analysis for specific movie\n│   ├── /movies/by-title/{title}/sentiment  # Sentiment by title\n│   ├── /alerts                      # Active crisis alerts\n│   ├── /alerts/{alert_id}           # Specific alert details\n│   ├── /baselines/genre/{genre}     # Genre sentiment baselines\n│   ├── /baselines/franchise/{franchise}  # Franchise sentiment baselines\n│   ├── /baselines/year/{year}       # Year sentiment baselines\n│   └── /monitoring                  # Real-time sentiment monitoring dashboard data\n│\n├── /viral-detection/                # \U0001F525 GOAL #2: Viral Content\n│   ├── /trending                    # Top viral movies\n│   ├── /trending/genre/{genre}      # Viral movies by genre\n│   ├── /movies/{id}/viral-score     # Viral score for specific movie\n│   ├── /thresholds                  # Viral thresholds by genre/budget/season\n│   ├── /velocity/{id}               # Engagement velocity for movie\n│   └── /opportunities               # Marketing amplification opportunities\n│\n├── /recommendations/                # \U0001F3AF GOAL #3: Content Recommendation\n│   ├── /dual-success                # Dual-success recommendations (main)\n│   ├── /dual-success/genre/{genre}  # Filtered by genre\n│   ├── /similar/{id}                # Content-based similar movies (single)\n│   ├── /similar?ids=1,2,3           # Content-based similar movies (multiple)\n│   ├── /reddit-buzz                 # Top Reddit buzz movies\n│   ├── /tmdb-quality                # Top TMDB quality movies\n│   └── /personalized                # Personalized recommendations (future)\n│\n└── /utilities/                      # Supporting endpoints\n    ├── /movies/{id}                 # Movie details (batch + speed merge)\n    ├── /movies/by-title/{title}     # Movie lookup by title\n    ├── /search                      # General movie search\n    └── /genres                      # Available genres list\n```\n\n---\n\n## \U0001F9EE API Endpoint Formulas & Calculations\n\n### Goal #1: Crisis Detection - Mathematical Definitions\n\n#### 1.1 `GET /crisis-detection/movies/{id}/sentiment`\n\n**Purpose:** Get sentiment analysis with deviation from baseline\n\n**Formula:**\n```\nCurrent Sentiment (S_current):\n  S_current = merge_sentiment(S_batch, S_speed)\n  where:\n    - If movie was discussed in last 48h: S_current = S_speed (average Reddit sentiment across all windows in 48h)\n    - Else: S_current = S_batch (historical sentiment from review analysis)\n  \n  S_speed calculation:\n    S_speed = AVG(metrics.avg_sentiment) across all speed_views windows in last 48h\n    Note: speed_views stores multiple time windows per movie, we average for overall sentiment\n\nBaseline Calculation:\n  The API fetches ALL available baseline types and returns complete analysis:\n  \n  1. Franchise Baseline (if movie.franchise IS NOT NULL):\n     baseline_franchise = sentiment_baselines.find_one({\n       \"franchise\": movie.franchise,\n       \"genre\": null,\n       \"year\": null\n     })\n  \n  2. Genre Baseline (if movie.genre IS NOT NULL):\n     baseline_genre = sentiment_baselines.find_one({\n       \"genre\": movie.genre,\n       \"franchise\": null,\n       \"year\": null\n     })\n  \n  3. Year Baseline (if movie.release_year IS NOT NULL):\n     baseline_year = sentiment_baselines.find_one({\n       \"year\": movie.release_year,\n       \"genre\": null,\n       \"franchise\": null\n     })\n\nDeviation Score (σ) - Calculated for EACH baseline:\n  For each baseline type:\n    σ = (S_current - baseline.avg_sentiment) / baseline.sentiment_stddev\n  where:\n    - baseline.sentiment_stddev = stddev of sentiment in that baseline context\n    - Negative σ indicates sentiment drop\n  \n  Primary Baseline Selection for Display:\n    The API chooses one baseline to highlight in \"baseline_used\" field:\n    - If franchise available: use franchise\n    - Else if genre available: use genre\n    - Else: use year\n    \n    NOTE: This is for UI display only. All baselines are calculated and returned.\n    No baseline is prioritized for crisis detection - all are evaluated equally.\n\nCrisis Threshold:\n  is_crisis = σ < -3.0  (3 standard deviations below baseline)\n  severity = {\n    \"critical\" if σ < -4.0\n    \"high\" if -4.0 ≤ σ < -3.0\n    \"warning\" if -3.0 ≤ σ < -2.0\n    \"normal\" if σ ≥ -2.0\n  }\n```\n\n**Response Schema:**\n```json\n{\n  \"movie_id\": 298618,\n  \"movie_title\": \"The Flash\",\n  \"current_sentiment\": -0.15,\n  \"sentiment_source\": \"speed_layer\",\n  \"baseline_used\": {\n    \"type\": \"franchise\",\n    \"value\": \"DC Extended Universe\",\n    \"avg_sentiment\": 0.05,\n    \"sentiment_stddev\": 0.034,\n    \"movie_count\": 15\n  },\n  \"baseline_alternatives\": {\n    \"franchise\": {\n      \"available\": true,\n      \"value\": \"DC Extended Universe\",\n      \"avg_sentiment\": 0.05,\n      \"sentiment_stddev\": 0.034,\n      \"movie_count\": 15\n    },\n    \"genre\": {\n      \"available\": true,\n      \"value\": \"Action\",\n      \"avg_sentiment\": 0.12,\n      \"sentiment_stddev\": 0.045,\n      \"movie_count\": 320\n    },\n    \"year\": {\n      \"available\": true,\n      \"value\": 2023,\n      \"avg_sentiment\": 0.08,\n      \"sentiment_stddev\": 0.038,\n      \"movie_count\": 145\n    }\n  },\n  \"deviation_analysis\": {\n    \"using_baseline\": {\n      \"type\": \"franchise\",\n      \"deviation_sigma\": -5.88,\n      \"is_crisis\": true,\n      \"severity\": \"critical\"\n    },\n    \"all_baselines\": {\n      \"franchise\": {\n        \"deviation_sigma\": -5.88,\n        \"is_crisis\": true,\n        \"severity\": \"critical\"\n      },\n      \"genre\": {\n        \"deviation_sigma\": -6.00,\n        \"is_crisis\": true,\n        \"severity\": \"critical\"\n      },\n      \"year\": {\n        \"deviation_sigma\": -6.05,\n        \"is_crisis\": true,\n        \"severity\": \"critical\"\n      }\n    },\n    \"comparison_note\": \"Crisis detected across all baseline types (all >3σ below baseline)\"\n  },\n  \"last_updated\": \"2025-12-18T10:30:00Z\"\n}\n```\n\n#### 1.2 `GET /crisis-detection/alerts`\n\n**Purpose:** List all movies currently in crisis state (σ < -3.0)\n\n**Query Logic:**\n```python\n# Step 1: Aggregate sentiment across all windows for each movie (last 48h)\n# Note: speed_views stores multiple windows per movie, we average for overall sentiment\ncutoff_time = datetime.utcnow() - timedelta(hours=48)\nspeed_movies = db.speed_views.aggregate([\n    # Filter to recent windows\n    {\"$match\": {\"window_start\": {\"$gte\": cutoff_time}}},\n    \n    # Group by movie, average sentiment across all windows\n    {\"$group\": {\n        \"_id\": \"$movie_title\",\n        \"movie_title\": {\"$first\": \"$movie_title\"},\n        \"avg_sentiment\": {\"$avg\": \"$metrics.avg_sentiment\"},  # Average across 48h period\n        \"latest_window\": {\"$max\": \"$window_start\"},\n        \"window_count\": {\"$sum\": 1}\n    }}\n])\n\n# Step 2: Match with batch layer and calculate deviation\nalerts = []\nfor speed_movie in speed_movies:\n    # Normalize title for batch layer matching\n    normalized_title = normalize_movie_title(speed_movie['movie_title'])\n    \n    # Find matching movie in batch layer\n    batch_movie = movie_intelligence.find_one({\n        \"title\": {\"$regex\": f\"^{re.escape(normalized_title)}$\", \"$options\": \"i\"}\n    })\n    \n    if not batch_movie:\n        continue\n    \n    S_current = speed_movie['avg_sentiment']  # Averaged across all windows in 48h\n    \n    # Get baseline using priority fallback\n    baseline = get_sentiment_baseline(batch_movie)  # franchise → genre → year\n    \n    if not baseline:\n        continue\n    \n    S_baseline = baseline[\"avg_sentiment\"]\n    σ_baseline = baseline[\"sentiment_stddev\"]\n    baseline_type = baseline.get(\"baseline_type\", \"unknown\")\n    \n    # Calculate deviation\n    σ = (S_current - S_baseline) / σ_baseline\n    \n    if σ < -3.0:\n        alerts.append({\n            \"movie_id\": batch_movie[\"movie_id\"],\n            \"movie_title\": batch_movie[\"title\"],\n            \"current_sentiment\": S_current,\n            \"baseline_sentiment\": S_baseline,\n            \"baseline_type\": baseline_type,\n            \"deviation_sigma\": round(σ, 2),\n            \"severity\": get_severity(σ),\n            \"alert_timestamp\": speed_movie['window_start'],\n            \"data_age_hours\": (datetime.utcnow() - speed_movie['window_start']).total_seconds() / 3600\n        })\n\n# Step 3: Sort by severity (most negative σ first)\nreturn sorted(alerts, key=lambda x: x[\"deviation_sigma\"])\n```\n\n**Filters:**\n- `severity`: \"critical\" | \"high\" | \"warning\"\n- `genre`: Filter by genre\n- `limit`: Max results (default 20)\n\n#### 1.3 `GET /crisis-detection/baselines/genre/{genre}`\n\n**Purpose:** Get sentiment baseline statistics for a genre\n\n**Formula:**\n```sql\nSELECT \n  genre,\n  AVG(avg_sentiment) as baseline_sentiment,\n  STDDEV(avg_sentiment) as stddev_sentiment,\n  COUNT(*) as sample_size,\n  MIN(avg_sentiment) as min_sentiment,\n  MAX(avg_sentiment) as max_sentiment,\n  PERCENTILE(avg_sentiment, 0.25) as q1_sentiment,\n  PERCENTILE(avg_sentiment, 0.50) as median_sentiment,\n  PERCENTILE(avg_sentiment, 0.75) as q3_sentiment\nFROM sentiment_baselines\nWHERE genre = {genre}\nGROUP BY genre\n```\n\n**Response Schema:**\n```json\n{\n  \"genre\": \"Action\",\n  \"baseline_sentiment\": 0.12,\n  \"stddev_sentiment\": 0.045,\n  \"sample_size\": 1543,\n  \"percentiles\": {\n    \"min\": -0.35,\n    \"q1\": 0.04,\n    \"median\": 0.13,\n    \"q3\": 0.21,\n    \"max\": 0.58\n  },\n  \"crisis_threshold\": -0.015,\n  \"data_range\": {\n    \"start_date\": \"2020-01-01\",\n    \"end_date\": \"2025-12-18\"\n  }\n}\n```\n\n#### 1.4 `GET /crisis-detection/baselines/franchise/{franchise}`\n\n**Purpose:** Get sentiment baseline statistics for a franchise\n\n**Query:**\n```javascript\ndb.sentiment_baselines.aggregate([\n  {\n    $match: {\n      franchise: franchise,\n      genre: null,\n      year: null\n    }\n  },\n  {\n    $group: {\n      _id: \"$franchise\",\n      baseline_sentiment: { $avg: \"$avg_sentiment\" },\n      stddev_sentiment: { $stdDev: \"$avg_sentiment\" },\n      sample_size: { $sum: \"$movie_count\" },\n      min_sentiment: { $min: \"$avg_sentiment\" },\n      max_sentiment: { $max: \"$avg_sentiment\" }\n    }\n  }\n])\n```\n\n**Response Schema:**\n```json\n{\n  \"franchise\": \"DC Extended Universe\",\n  \"baseline_sentiment\": 0.05,\n  \"stddev_sentiment\": 0.034,\n  \"sample_size\": 15,\n  \"percentiles\": {\n    \"min\": -0.08,\n    \"q1\": 0.02,\n    \"median\": 0.05,\n    \"q3\": 0.08,\n    \"max\": 0.12\n  },\n  \"crisis_threshold\": -0.052\n}\n```\n\n#### 1.5 `GET /crisis-detection/baselines/year/{year}`\n\n**Purpose:** Get sentiment baseline statistics for a release year\n\n**Query:**\n```javascript\ndb.sentiment_baselines.aggregate([\n  {\n    $match: {\n      year: parseInt(year),\n      genre: null,\n      franchise: null\n    }\n  },\n  {\n    $group: {\n      _id: \"$year\",\n      baseline_sentiment: { $avg: \"$avg_sentiment\" },\n      stddev_sentiment: { $stdDev: \"$avg_sentiment\" },\n      sample_size: { $sum: \"$movie_count\" },\n      min_sentiment: { $min: \"$avg_sentiment\" },\n      max_sentiment: { $max: \"$avg_sentiment\" }\n    }\n  }\n])\n```\n\n**Response Schema:**\n```json\n{\n  \"year\": 2023,\n  \"baseline_sentiment\": 0.08,\n  \"stddev_sentiment\": 0.038,\n  \"sample_size\": 145,\n  \"percentiles\": {\n    \"min\": -0.12,\n    \"q1\": 0.05,\n    \"median\": 0.08,\n    \"q3\": 0.11,\n    \"max\": 0.18\n  },\n  \"crisis_threshold\": -0.034\n}\n```\n\n#### 1.6 `GET /crisis-detection/monitoring`\n\n**Purpose:** Real-time dashboard data for monitoring\n\n**Aggregation:**\n```python\n# Count movies in each severity category\nseverity_counts = {\n  \"critical\": count(σ < -4.0),\n  \"high\": count(-4.0 ≤ σ < -3.0),\n  \"warning\": count(-3.0 ≤ σ < -2.0),\n  \"normal\": count(σ ≥ -2.0)\n}\n\n# Average response time to crisis\navg_response_time = AVG(\n  alert_acknowledged_time - alert_created_time\n  WHERE severity IN [\"critical\", \"high\"]\n)\n\n# Sentiment velocity (rate of change)\nfor movie in active_movies:\n  velocity = (S_current - S_1h_ago) / 1h  # sentiment change per hour\n```\n\n---\n\n### Goal #2: Viral Detection - Mathematical Definitions\n\n#### 2.1 `GET /viral-detection/trending`\n\n**Purpose:** Get top viral movies ranked by viral coefficient\n\n**Viral Coefficient Formula:**\n```\nViral Coefficient (V):\n  V = viral_score / avg_popularity\n  where:\n    viral_score = Pre-calculated from speed_views.metrics (Reddit engagement velocity)\n    avg_popularity = Average TMDB popularity for genre (from viral_thresholds)\n\nData Distribution:\n  - viral_score range: 0 to ~5.2 (Reddit engagement per hour)\n  - avg_popularity range: ~7 to ~19 (TMDB popularity score)\n  - Coefficient range: 0 to ~0.34 (observed from actual data)\n  - p95 = 0.039, p75 = 0.009, p50 = 0.003 (percentiles)\n\nViral Score (from speed_views):\n  Aggregated from streaming layer:\n    viral_score = SUM(metrics.viral_score) across all windows in 48h period\n    Note: speed_views stores multiple time windows per movie, we sum for total engagement\n  \n  Components tracked separately in each window:\n    - upvote_velocity = rate of upvote change\n    - comment_velocity = rate of comment change  \n    - award_velocity = rate of award change\n\nContext-Aware Threshold (SINGLE DIMENSION):\n  Priority order for threshold lookup:\n  \n  1. Genre-specific threshold (preferred):\n     threshold_doc = viral_thresholds.find_one({\n       \"genre\": movie.genre,\n       \"budget_tier\": null,\n       \"season\": null\n     })\n     threshold = threshold_doc[\"avg_popularity\"]  # Use popularity, NOT viral_threshold!\n  \n  2. Global threshold (fallback):\n     threshold_doc = viral_thresholds.find_one({\n       \"genre\": null,\n       \"budget_tier\": null,\n       \"season\": null\n     })\n     threshold = threshold_doc[\"avg_popularity\"]\n  \n  NOTE: We use avg_popularity instead of viral_threshold because:\n    - viral_threshold = 99th percentile of vote_count (cumulative historical)\n    - avg_popularity = current TMDB buzz metric (recent activity)\n    - Comparing \"current Reddit buzz\" to \"current TMDB buzz\" is semantically correct\n\nViral Status (based on percentile thresholds):\n  status = {\n    \"viral\" if V ≥ 0.3      # Top 5% (extremely high engagement)\n    \"trending\" if 0.15 ≤ V < 0.3  # Top 10% (high engagement)\n    \"growing\" if 0.05 ≤ V < 0.15  # Top 25% (moderate engagement)\n    \"stable\" if V < 0.05    # Below top 25% (normal/low engagement)\n  }\n  \n  Note: Thresholds derived from actual data distribution:\n    - p95 = 0.039 (top 5%)\n    - p90 = 0.027 (top 10%)\n    - p75 = 0.009 (top 25%)\n    - Rounded up for clearer thresholds (0.3, 0.15, 0.05)\n```\n\n**Ranking Algorithm:**\n```python\n# Aggregate speed_views to get one record per movie (handles multiple time windows)\n# Note: speed_views has 48h TTL, so all data in collection is already within 48h\n# No need for explicit time cutoff - collection auto-expires old data\nspeed_data = db.speed_views.aggregate([\n    # Group by movie, summing metrics across all windows (more discussion = more viral)\n    {\"$group\": {\n        \"_id\": \"$movie_title\",\n        \"movie_title\": {\"$first\": \"$movie_title\"},\n        \"total_viral_score\": {\"$sum\": \"$metrics.viral_score\"},  # Sum across all windows\n        \"latest_window\": {\"$max\": \"$window_start\"},\n        \"total_upvotes\": {\"$sum\": \"$metrics.total_upvotes\"},\n        \"total_comments\": {\"$sum\": \"$metrics.total_comments\"},\n        \"total_awards\": {\"$sum\": \"$metrics.total_awards\"},\n        \"avg_sentiment\": {\"$avg\": \"$metrics.avg_sentiment\"},\n        \"max_upvote_velocity\": {\"$max\": \"$metrics.upvote_velocity\"},\n        \"max_comment_velocity\": {\"$max\": \"$metrics.comment_velocity\"},\n        \"max_award_velocity\": {\"$max\": \"$metrics.award_velocity\"},\n        \"window_count\": {\"$sum\": 1}\n    }},\n    \n    # Sort by total viral score descending\n    {\"$sort\": {\"total_viral_score\": -1}}\n])\n\nmovies = []\nfor row in speed_data:\n    # Match with batch layer to get movie intelligence data\n    normalized_title = normalize_movie_title(row['movie_title'])\n    batch_movie = db.movie_intelligence.find_one({\n        \"title\": {\"$regex\": f\"^{re.escape(normalized_title)}$\", \"$options\": \"i\"}\n    })\n    \n    if not batch_movie:\n        continue\n    \n    # Get threshold for genre only (SINGLE dimension as per schema)\n    # Note: genre in movie_intelligence is a single string, not array\n    genre = batch_movie.get(\"genre\", \"\")\n    threshold_doc = db.viral_thresholds.find_one({\n        \"genre\": genre,\n        \"budget_tier\": None,\n        \"season\": None\n    })\n    \n    if not threshold_doc:\n        # Fallback to global threshold (all null dimensions)\n        threshold_doc = db.viral_thresholds.find_one({\n            \"genre\": None,\n            \"budget_tier\": None,\n            \"season\": None\n        })\n    \n    if not threshold_doc:\n        continue\n    \n    # Use avg_popularity as threshold (current TMDB buzz)\n    # NOT viral_threshold (which is 99th percentile of vote_count)\n    threshold = threshold_doc[\"avg_popularity\"]\n    \n    # Calculate viral coefficient using total viral_score (summed across all windows)\n    viral_score = row['total_viral_score']\n    V = viral_score / threshold\n    \n    # Determine viral status based on percentile thresholds\n    if V >= 0.3:\n        status = \"viral\"\n    elif V >= 0.15:\n        status = \"trending\"\n    elif V >= 0.05:\n        status = \"growing\"\n    else:\n        status = \"stable\"\n    \n    movies.append({\n        # Movie identification\n        \"movie_id\": batch_movie.get(\"movie_id\"),\n        \"movie_title\": batch_movie.get(\"title\"),\n        \n        # Viral metrics (from speed layer aggregation)\n        \"viral_coefficient\": V,\n        \"viral_score\": viral_score,  # Total viral score across all windows\n        \"viral_status\": status,\n        \"upvote_velocity\": row['max_upvote_velocity'],\n        \"comment_velocity\": row['max_comment_velocity'],\n        \"award_velocity\": row['max_award_velocity'],\n        \n        # Reddit engagement (aggregated across all windows)\n        \"total_upvotes\": row['total_upvotes'],\n        \"total_comments\": row['total_comments'],\n        \"total_awards\": row['total_awards'],\n        \"avg_sentiment\": row['avg_sentiment'],\n        \n        # Movie intelligence (from batch layer)\n        \"genre\": genre,\n        \"budget_tier\": batch_movie.get(\"budget_tier\"),\n        \"vote_average\": batch_movie.get(\"vote_average\"),\n        \"vote_count\": batch_movie.get(\"vote_count\"),\n        \"popularity\": batch_movie.get(\"popularity\"),\n        \"release_year\": batch_movie.get(\"release_year\"),\n        \"franchise\": batch_movie.get(\"franchise\"),\n        \n        # Threshold context\n        \"threshold_used\": threshold,\n        \"threshold_type\": \"avg_popularity\",  # Using popularity, not vote_count\n        \"threshold_dimension\": \"genre\" if threshold_doc.get(\"genre\") else \"global\",\n        \n        # Timestamps\n        \"last_window_start\": row['latest_window']\n    })\n\n# Sort by viral coefficient descending\nreturn sorted(movies, key=lambda x: x[\"viral_coefficient\"], reverse=True)\n```\n\n**Query Parameters:**\n- `genre`: Filter by genre\n- `limit`: Max results (default 20)\n- `viral_threshold`: Min viral coefficient (default 1.0)\n- `window`: Time window in hours (default 48)\n\n#### 2.2 `GET /viral-detection/movies/{id}/viral-score`\n\n**Purpose:** Get detailed viral metrics for specific movie\n\n**Viral Coefficient Calculation:**\n```python\n# Aggregate viral_scores from ALL speed_views data (same as 2.1)\n# Note: speed_views has 48h TTL, so all data is recent by definition\nspeed_data = db.speed_views.aggregate([\n    # Filter to this movie only (no time cutoff - all data is within 48h TTL)\n    {\"$match\": {\n        \"movie_title\": movie_title\n    }},\n    \n    # Sum viral_score across all windows (handles multiple time windows)\n    {\"$group\": {\n        \"_id\": \"$movie_title\",\n        \"total_viral_score\": {\"$sum\": \"$metrics.viral_score\"},\n        \"total_upvotes\": {\"$sum\": \"$metrics.total_upvotes\"},\n        \"total_comments\": {\"$sum\": \"$metrics.total_comments\"},\n        \"total_awards\": {\"$sum\": \"$metrics.total_awards\"},\n        \"avg_sentiment\": {\"$avg\": \"$metrics.avg_sentiment\"},\n        \"max_upvote_velocity\": {\"$max\": \"$metrics.upvote_velocity\"},\n        \"max_comment_velocity\": {\"$max\": \"$metrics.comment_velocity\"},\n        \"max_award_velocity\": {\"$max\": \"$metrics.award_velocity\"},\n        \"latest_window\": {\"$max\": \"$window_start\"},\n        \"window_count\": {\"$sum\": 1}\n    }}\n])\n\n# Get threshold (same logic as 2.1)\nbatch_movie = db.movie_intelligence.find_one({\"movie_id\": movie_id})\ngenre = batch_movie.get(\"genre\", \"\")\nthreshold_doc = db.viral_thresholds.find_one({\n    \"genre\": genre,\n    \"budget_tier\": None,\n    \"season\": None\n})\n\nif not threshold_doc:\n    threshold_doc = db.viral_thresholds.find_one({\n        \"genre\": None,\n        \"budget_tier\": None,\n        \"season\": None\n    })\n\nthreshold = threshold_doc[\"avg_popularity\"]\n\n# Extract aggregation result (cursor returns list with one element)\nspeed_result = list(speed_data)[0] if speed_data else None\n\nif not speed_result:\n    # No speed layer data available\n    return {\"error\": \"No recent discussion data found\"}\n\n# Calculate viral coefficient using summed total_viral_score\nviral_score = speed_result['total_viral_score']\nviral_coefficient = viral_score / threshold\n\n# Determine viral status\nif viral_coefficient >= 0.3:\n    viral_status = \"viral\"\nelif viral_coefficient >= 0.15:\n    viral_status = \"trending\"\nelif viral_coefficient >= 0.05:\n    viral_status = \"growing\"\nelse:\n    viral_status = \"stable\"\n```\n\n**Implementation Note - Trending Trajectory:**\nThe `trending_trajectory` field requires historical rank tracking. Since rank data is not stored in MongoDB, it must be calculated on-demand:\n1. Calculate current viral coefficients for all movies → rank them → find current rank\n2. Query 24h old data from `speed_views` → calculate 24h ago viral coefficients (sum across windows) → rank them → find 24h ago rank\n3. Compare ranks to get `rank_change`\n4. Compare current total viral_score to 24h ago total viral_score to determine `velocity_trend` (accelerating/decelerating/stable)\n\n**Alternative Implementation:** Cache daily rankings in Redis with TTL=7 days for faster lookups.\n\n**Response Schema:**\n```json\n{\n  \"movie_id\": 298618,\n  \"movie_title\": \"The Flash\",\n  \"viral_coefficient\": 2.3,\n  \"viral_status\": \"viral\",\n  \"engagement_metrics\": {\n    \"upvote_velocity\": 125.4,\n    \"comment_velocity\": 45.2,\n    \"total_velocity\": 215.8,\n    \"time_window\": \"48h\"\n  },\n  \"threshold_context\": {\n    \"genre\": \"Action\",\n    \"budget_tier\": \"blockbuster\",\n    \"season\": \"summer\",\n    \"threshold_value\": 93.8\n  },\n  \"reddit_metrics\": {\n    \"total_upvotes\": 2450,\n    \"total_comments\": 876,\n    \"total_awards\": 12,\n    \"avg_sentiment\": 0.65,\n    \"data_points\": 15\n  },\n  \"trending_trajectory\": {\n    \"current_rank\": 2,\n    \"rank_24h_ago\": 5,\n    \"rank_change\": +3,\n    \"velocity_trend\": \"accelerating\"\n  }\n}\n```\n\n#### 2.3 `GET /viral-detection/thresholds`\n\n**Purpose:** Get viral thresholds by context (genre, budget, season)\n\n**Note on Threshold Usage:**\n- `avg_popularity` is used as the threshold denominator in viral coefficient calculation (V = viral_score / avg_popularity)\n- `viral_threshold` (99th percentile of vote_count) is stored but NOT used in the calculation\n- This endpoint returns both values for reference, but only `avg_popularity` is semantically correct for comparing Reddit buzz to TMDB buzz\n\n**Query Logic:**\n```python\n# viral_thresholds schema: EXACTLY ONE dimension per document\n# Valid: {\"genre\": \"Action\", \"budget_tier\": null, \"season\": null}\n# Invalid: {\"genre\": \"Action\", \"budget_tier\": \"high\", \"season\": \"summer\"}\n\n# Priority: genre > budget_tier > season (query ONE dimension only)\nif genre:\n    threshold = viral_thresholds.find_one({\n        \"genre\": genre,\n        \"budget_tier\": None,\n        \"season\": None\n    })\n    if threshold:\n        return {\n            \"dimension\": \"genre\",\n            \"value\": genre,\n            \"threshold_used_in_calculation\": threshold[\"avg_popularity\"],  # ✅ THIS is used for viral coefficient\n            \"avg_popularity\": threshold[\"avg_popularity\"],  # Current TMDB buzz metric\n            \"viral_threshold\": threshold[\"viral_threshold\"],  # 99th percentile vote_count (NOT used)\n            \"movie_count\": threshold[\"movie_count\"],\n            \"note\": \"avg_popularity is used as denominator in viral coefficient calculation\"\n        }\n\nelif budget_tier:\n    threshold = viral_thresholds.find_one({\n        \"genre\": None,\n        \"budget_tier\": budget_tier,\n        \"season\": None\n    })\n    if threshold:\n        return {\n            \"dimension\": \"budget_tier\",\n            \"value\": budget_tier,\n            \"threshold_used_in_calculation\": threshold[\"avg_popularity\"],\n            \"avg_popularity\": threshold[\"avg_popularity\"],\n            \"viral_threshold\": threshold[\"viral_threshold\"],\n            \"budget_tier_coefficient\": threshold.get(\"budget_tier_coefficient\", 2.5),\n            \"movie_count\": threshold[\"movie_count\"]\n        }\n\nelif season:\n    threshold = viral_thresholds.find_one({\n        \"genre\": None,\n        \"budget_tier\": None,\n        \"season\": season\n    })\n    if threshold:\n        return {\n            \"dimension\": \"season\",\n            \"value\": season,\n            \"threshold_used_in_calculation\": threshold[\"avg_popularity\"],\n            \"avg_popularity\": threshold[\"avg_popularity\"],\n            \"viral_threshold\": threshold[\"viral_threshold\"],\n            \"seasonal_threshold\": threshold.get(\"seasonal_threshold\"),\n            \"movie_count\": threshold[\"movie_count\"]\n        }\n\n# If no filter, return all genre thresholds\nelse:\n    genre_thresholds = viral_thresholds.find({\n        \"genre\": {\"$ne\": None},\n        \"budget_tier\": None,\n        \"season\": None\n    })\n    return [\n        {\n            \"genre\": t[\"genre\"],\n            \"threshold_used_in_calculation\": t[\"avg_popularity\"],  # ✅ Used in calculation\n            \"avg_popularity\": t[\"avg_popularity\"],\n            \"viral_threshold\": t[\"viral_threshold\"]  # NOT used, just for reference\n        }\n        for t in genre_thresholds\n    ]\n```\n\n#### 2.4 `GET /viral-detection/opportunities`\n\n**Status:** ✅ **IMPLEMENTED & CALIBRATED** (December 18, 2025)\n\n**Purpose:** Identify marketing amplification opportunities\n\n**Opportunity Score Formula (SIMPLIFIED & CALIBRATED):**\n```\nOpportunity Score (O):\n  O = V × (1 + urgency)\n  where:\n    V = viral_coefficient (from 2.1)\n    urgency = recency × momentum\n    \n    recency = exp(-age_hours / 24)\n      - Measures time since LATEST engagement (not when discussion started)\n      - Decays exponentially: fresher content = higher opportunity\n      - Half-life of 24 hours\n      - Range: 0 to 1 (1 = just posted, 0.5 = 24h old, 0.14 = 48h old)\n    \n    momentum = velocity_now / velocity_24h_ago\n      - Accelerating trends get boost\n      - >1.0 = accelerating, <1.0 = decelerating, =0 = no previous activity\n      - Range: 0 to infinity (typically 0-2)\n    \n    urgency = recency × momentum\n      - Combines freshness and acceleration\n      - High urgency = fresh content that's accelerating\n      - Range: 0 to ~2 (0 = old/decelerating, 1 = fresh+stable, 2 = fresh+doubling)\n\nIntuition:\n  \"Viral score × urgency multiplier\"\n  - Fresh + Accelerating = High urgency, act now!\n  - Old + Decelerating = Low urgency, let it fade\n  - Multiplier range: 1.0 (no urgency) to 3.0 (maximum urgency)\n\nRecommendation Logic (CALIBRATED TO DATA):\n  Data analysis: V_max=0.338, O_95th=0.060, O_90th=0.050, O_75th=0.010\n  \n  recommended_action = {\n    \"amplify_immediately\" if O ≥ 0.060 and urgency ≥ 0.99  (top 5% + urgent)\n    \"monitor_closely\" if O ≥ 0.050                         (top 10%)\n    \"organic_growth\" if O ≥ 0.010                          (top 25%)\n    \"evaluate\" if O < 0.010                                (bottom 75%)\n  }\n\nEstimated Reach:\n  estimated_reach = velocity_now * amplification_multiplier * time_horizon\n  where:\n    amplification_multiplier = 3.0 (assumed 3x with marketing push)\n    time_horizon = 7 days = 168 hours\n```\n\n**Query Parameters:**\n```\n- min_viral_coefficient: float = 0.001 (default)\n- min_opportunity_score: float = 0.001 (default)\n- limit: int = 10 (default, max 50)\n```\n\n**Calibration History:**\n```\nDate: December 18, 2025\nDataset: 50 movies analyzed from production data\n\nOriginal Thresholds (theoretical):\n  - min_viral_coefficient: 0.01\n  - amplify: O ≥ 0.6 & U ≥ 1.5\n  - monitor: O ≥ 0.3\n  - organic: O ≥ 0.1\n  Result: 96% evaluate, 2% organic, 2% monitor, 0% amplify ❌\n\nCalibrated Thresholds (data-driven percentiles):\n  - min_viral_coefficient: 0.001 (10x lower)\n  - amplify: O ≥ 0.060 & U ≥ 0.99 (top 5% + top 10% urgency)\n  - monitor: O ≥ 0.050 (top 10%)\n  - organic: O ≥ 0.010 (top 25%)\n  Result: 25% evaluate, 45% organic, 30% monitor, 0% amplify ✅\n  \nImprovement: 75% actionable recommendations (vs 4% before)\n```\n\n**Query:**\n\n**Implementation (UPDATED):**\n\n```python\nopportunities = []\nfor movie in get_trending_movies(min_viral_coefficient=min_viral_coefficient):\n    # Get speed layer data from MongoDB\n    speed_views = list(db.speed_views.find(\n        {\"movie_title\": normalize_movie_title(movie.movie_title)}\n    ))\n    \n    if not speed_views:\n        continue  # No speed data available\n    \n    # Get latest window for recency (when was LATEST engagement?)\n    latest_window = max(speed_views, key=lambda x: x['window_start'])\n    earliest_window = min(speed_views, key=lambda x: x['window_start'])\n    \n    # Recency: time since LATEST engagement\n    age_hours = (now - latest_window['window_start']).total_seconds() / 3600\n    recency = exp(-age_hours / 24)  # Exponential decay, half-life 24h\n    \n    # Momentum: compare latest vs earliest velocity\n    velocity_now = latest_window.get('metrics', {}).get('viral_score', 0)\n    velocity_24h_ago = earliest_window.get('metrics', {}).get('viral_score', 0) if earliest_window else velocity_now\n    momentum = velocity_now / velocity_24h_ago if velocity_24h_ago > 0 else 1.0\n    \n    # Calculate urgency (combines recency and momentum)\n    urgency = recency * momentum\n    \n    # NEW FORMULA: O = V × (1 + urgency)\n    V = movie.viral_metrics.viral_coefficient\n    O = V * (1 + urgency)\n    \n    # Filter by minimum opportunity score\n    if O < min_opportunity_score:\n        continue\n    \n    # Determine recommended action (CALIBRATED thresholds)\n    if O >= 0.060 and urgency >= 0.99:\n        recommended_action = \"amplify_immediately\"  # Top 5% + urgent\n    elif O >= 0.050:\n        recommended_action = \"monitor_closely\"  # Top 10%\n    elif O >= 0.010:\n        recommended_action = \"organic_growth\"  # Top 25%\n    else:\n        recommended_action = \"evaluate\"  # Bottom 75%\n    \n    # Estimated reach with marketing amplification\n    estimated_reach = velocity_now * 3.0 * 7 * 24  # 3x amplification over 7 days\n    \n    opportunities.append({\n        \"movie_id\": movie.movie_id,\n        \"movie_title\": movie.movie_title,\n        \"viral_coefficient\": V,\n        \"opportunity_score\": O,\n        \"recommended_action\": recommended_action,\n        \"estimated_reach\": estimated_reach,\n        \"factors\": {\n            \"recency\": recency,\n            \"momentum\": momentum,\n            \"reach\": urgency  # Stored as 'reach' for backward compatibility\n        },\n        \"age_hours\": age_hours,\n        \"velocity_now\": velocity_now,\n        \"velocity_24h_ago\": velocity_24h_ago\n    })\n\n# Sort by opportunity score (descending) and apply limit\nreturn sorted(opportunities, key=lambda x: x[\"opportunity_score\"], reverse=True)[:limit]\n```\n\n**Response Schema:**\n\n```python\n{\n    \"opportunities\": [\n        {\n            \"movie_id\": 1233413,\n            \"movie_title\": \"Sinners\",\n            \"viral_coefficient\": 0.3380,\n            \"opportunity_score\": 0.3380,\n            \"recommended_action\": \"monitor_closely\",\n            \"estimated_reach\": 0.0,\n            \"factors\": {\n                \"recency\": 0.9912,\n                \"momentum\": 0.0,\n                \"reach\": 0.0  # Actually stores urgency\n            },\n            \"age_hours\": 0.21,\n            \"velocity_now\": 0.0,\n            \"velocity_24h_ago\": 5.18\n        }\n    ],\n    \"count\": 1,\n    \"filters_applied\": {\n        \"min_viral_coefficient\": 0.001,\n        \"min_opportunity_score\": 0.001,\n        \"limit\": 10\n    }\n}\n```\n\n---\n\n### Goal #3: Recommendations - Mathematical Definitions\n\n#### 3.1 `GET /recommendations/dual-success`\n\n**Status:** ✅ **FORMULA CALIBRATED** (December 18, 2025)\n\n**Purpose:** Dual-success recommendations (60% Reddit buzz + 40% TMDB quality)\n\n**Calibration:** Based on analysis of 3,657 movies from production database. See `TMDB_SCORE_CALIBRATION.md` for details.\n\n**Dual-Success Score Formula:**\n```\nDual-Success Score (D):\n  D = 0.6 * Reddit_Score + 0.4 * TMDB_Score\n  where both scores are normalized to 0-100 scale\n\nReddit Buzz Score (0-100):\n  Reddit_Score = normalize(\n    log10(total_engagement + 1) * recency_weight\n  )\n  where:\n    total_engagement = upvotes + comments * 2 + awards * 10\n    Note: crossposts data not available in speed_views\n    \n    recency_weight = {\n      1.0 if discussed in last 24h\n      0.8 if discussed in last 48h\n      0.6 if discussed in last 7d\n      0.4 if discussed in last 30d\n      0.2 otherwise\n    }\n    \n    normalize(x) = (x - min(x)) / (max(x) - min(x)) * 100\n\nTMDB Popularity Score (0-100):\n  TMDB_Score = normalize(TMDB_Raw)\n  where:\n    TMDB_Raw = 0.5*popularity + 0.3*(vote_average*10) + 0.2*log10(vote_count+1)\n    \n    Components (calibrated from 3,657 movies):\n    \n    1. Popularity (50% weight):\n       - Range: 0.01 to 446.11 (mean: 10.27, median: 7.85)\n       - Captures: Daily-updated buzz (views, votes, watchlist adds)\n       - Why 50%: Primary signal for \"current attention\"\n    \n    2. Vote Average (30% weight):\n       - Range: 0.0 to 10.0 (mean: 7.07, median: 7.40)\n       - Scaled: vote_average * 10 to match popularity range\n       - Captures: Quality rating from TMDB users\n       - Why 30%: Adds quality dimension (correlation with popularity: -0.077)\n    \n    3. Vote Count (20% weight):\n       - Range: 1 to 38,406 (mean: 3,037, median: 997)\n       - Transformed: log10(vote_count + 1) to handle skew\n       - Captures: Credibility/sample size\n       - Why 20%: Prevents low-vote movies from ranking too high\n    \n    Normalization:\n      normalize(x) = (x - min(x)) / (max(x) - min(x)) * 100\n      Applied after calculating TMDB_Raw for all movies\n    \n    Calibration Note:\n      - Low correlation (-0.077) between popularity and vote_average means\n        they capture independent signals - no redundancy\n      - Combining all three provides comprehensive TMDB quality signal\n      - Data analyzed: 3,657 movies from production database\n      - Calibration date: December 18, 2025\n      - Full report: TMDB_SCORE_CALIBRATION.md\n\nMinimum Thresholds (applied AFTER scoring):\n  - min_rating: vote_average ≥ 6.0 (default, ensures quality filter)\n  - min_reddit_engagement: total_engagement ≥ 10\n  - min_popularity: popularity ≥ 1.0 (ensures some TMDB buzz)\n```\n\n**Ranking Algorithm:**\n```python\nrecommendations = []\n\n# Get movies from both layers\nbatch_movies = movie_intelligence.find({\"vote_average\": {\"$gte\": min_rating}})\n# Query speed_views collection with correct field name\ncutoff_time = datetime.utcnow() - timedelta(days=30)\nspeed_movies = db.speed_views.find({\"window_start\": {\"$gte\": cutoff_time}})\n\n# Merge on movie_title (speed_views uses movie_title, not movie_id)\nmerged_movies = merge_on_movie_title(batch_movies, speed_movies)\n\nfor movie in merged_movies:\n    # Calculate Reddit Score\n    if movie.has_speed_data:\n        # Get aggregated metrics from speed_views\n        upvotes = movie.speed_metrics['total_upvotes']\n        comments = movie.speed_metrics['total_comments']\n        awards = movie.speed_metrics['total_awards']\n        total_engagement = upvotes + comments * 2 + awards * 10\n        \n        age_hours = (now - movie.last_window_start).hours\n        recency_weight = get_recency_weight(age_hours)\n        \n        reddit_raw = log10(total_engagement + 1) * recency_weight\n    else:\n        reddit_raw = 0\n    \n    # Calculate TMDB Score (using calibrated hybrid formula)\n    # Components: 50% popularity + 30% quality + 20% credibility\n    tmdb_raw = (\n        0.5 * movie.popularity +\n        0.3 * (movie.vote_average * 10) +\n        0.2 * log10(movie.vote_count + 1)\n    )\n    \n    # Store for normalization\n    movie.reddit_raw = reddit_raw\n    movie.tmdb_raw = tmdb_raw\n\n# Normalize scores to 0-100\nreddit_min, reddit_max = min(reddit_raw), max(reddit_raw)\ntmdb_min, tmdb_max = min(tmdb_raw), max(tmdb_raw)\n\nfor movie in merged_movies:\n    reddit_score = (movie.reddit_raw - reddit_min) / (reddit_max - reddit_min) * 100\n    tmdb_score = (movie.tmdb_raw - tmdb_min) / (tmdb_max - tmdb_min) * 100\n    \n    dual_success_score = 0.6 * reddit_score + 0.4 * tmdb_score\n    \n    # Apply minimum thresholds\n    if (movie.vote_average >= min_rating and \n        movie.total_engagement >= 10 and\n        movie.popularity >= 1.0 and\n        movie.vote_count >= 50):\n        \n        recommendations.append({\n            \"rank\": None,  # Assigned after sorting\n            \"movie_id\": movie.movie_id,\n            \"movie_title\": movie.title,\n            \"genre\": movie.genre,  # Single genre field (string)\n            \"dual_success_score\": round(dual_success_score, 1),\n            \"reddit_buzz_score\": round(reddit_score, 1),\n            \"tmdb_score\": round(tmdb_score, 1),\n            \"vote_average\": movie.vote_average,\n            \"vote_count\": movie.vote_count,\n            \"popularity\": movie.popularity,\n            \"reddit_mentions\": movie.discussion_count,\n            \"speed_layer_contribution\": reddit_score > 0\n        })\n\n# Sort by dual-success score\nsorted_recs = sorted(recommendations, key=lambda x: x[\"dual_success_score\"], reverse=True)\n\n# Assign ranks\nfor i, rec in enumerate(sorted_recs):\n    rec[\"rank\"] = i + 1\n\nreturn sorted_recs[:limit]\n```\n\n#### 3.2 `GET /recommendations/similar/{id}` or `GET /recommendations/similar?ids=123,456,789`\n\n**Purpose:** Content-based similarity using cosine similarity (supports single or multiple input movies)\n\n**URL Formats:**\n- Single movie: `/recommendations/similar/299534`\n- Multiple movies: `/recommendations/similar?ids=299534,299536,299537`\n\n**Query Parameters:**\n- `ids` (optional): Comma-separated list of movie IDs (alternative to path parameter)\n- `limit` (optional, default=10): Number of recommendations to return\n- `strategy` (optional, default=\"average\"): How to combine multiple movies\n  - `\"average\"`: Average feature vectors (balanced preferences)\n  - `\"union\"`: Find movies similar to ANY input movie (diverse)\n  - `\"intersection\"`: Find movies similar to ALL input movies (focused)\n\n**Cosine Similarity Formula:**\n```\nSimilarity Score (sim):\n  sim(movie_A, movie_B) = cosine_similarity(vec_A, vec_B)\n  where:\n    vec = feature vector combining:\n      - Genre matching (1-hot encoding)\n      - Director matching (binary feature)\n      - Franchise matching (binary feature)\n      - Budget tier similarity\n      - Release year proximity\n\nCosine Similarity:\n  sim = (vec_A · vec_B) / (||vec_A|| * ||vec_B||)\n  Result range: [-1, 1], where 1 = identical, 0 = orthogonal, -1 = opposite\n\nFeature Vector Construction:\n  vec = [genre_match, director_match, franchise_match, budget_tier_similarity, year_proximity]\n  \n  genre_match (binary):\n    - 1 if same genre, 0 otherwise\n  \n  director_match (binary):\n    - 1 if same director, 0 otherwise\n  \n  franchise_match (binary):\n    - 1 if same franchise, 0 otherwise\n    \n  budget_tier_similarity (0-1):\n    - 1 if same tier, 0.5 if adjacent tier, 0 otherwise\n    \n  year_proximity (0-1):\n    - 1 if same year, decreasing with year difference\n\nMulti-Movie Strategies:\n  \n  1. Average Strategy (default):\n     user_preference_vec = mean([vec_1, vec_2, ..., vec_n])\n     sim(candidate) = cosine_similarity(user_preference_vec, candidate_vec)\n     \n     Use case: Balanced recommendations across all liked movies\n     Example: Like \"Inception\", \"Interstellar\", \"The Matrix\" → sci-fi mind-benders\n  \n  2. Union Strategy:\n     For each candidate, calculate similarity to ALL input movies\n     final_score = max(sim_1, sim_2, ..., sim_n)\n     \n     Use case: Diverse recommendations, similar to ANY liked movie\n     Example: Like \"Inception\" OR \"The Notebook\" → diverse romance + sci-fi results\n  \n  3. Intersection Strategy:\n     final_score = min(sim_1, sim_2, ..., sim_n)\n     \n     Use case: Focused recommendations, similar to ALL liked movies\n     Example: Like \"Dark Knight\", \"Iron Man\", \"Avengers\" → must be superhero + action\n\nSentiment-Aware Boost (applied to all strategies):\n  final_score = sim * sentiment_boost\n  where:\n    sentiment_boost = {\n      1.2 if both movies have positive sentiment (>0.3)\n      1.0 if neutral\n      0.8 if either has negative sentiment (<-0.3)\n    }\n    Note: avg_sentiment range is -1.0 to 1.0, not TMDB rating scale\n    \n    For multi-movie input:\n      - Average the sentiments of all input movies\n      - Compare averaged sentiment against candidate sentiment\n```\n\n**Feature Vector Implementation:**\n\n```python\nimport numpy as np\nfrom math import exp\n\n# Budget tier ordering for adjacency calculation\nBUDGET_TIERS = [\"indie\", \"mid\", \"blockbuster\", \"unknown\"]\n\ndef build_feature_vector(movie):\n    \"\"\"\n    Build a 5-dimensional feature vector for content-based similarity.\n    \n    Based on movie_intelligence schema fields:\n    - genre: String (single genre, not array)\n    - director: String\n    - franchise: String or null\n    - budget_tier: String (\"indie\", \"mid\", \"blockbuster\", \"unknown\")\n    - release_year: Integer\n    \n    Returns:\n        numpy.ndarray: 5-element feature vector [genre, director, franchise, budget_tier, year]\n    \"\"\"\n    # Store original values (not one-hot encoded)\n    # Comparison happens during cosine similarity calculation\n    return {\n        'genre': movie.get('genre', ''),           # String\n        'director': movie.get('director', ''),     # String\n        'franchise': movie.get('franchise', None), # String or None\n        'budget_tier': movie.get('budget_tier', 'unknown'),  # String\n        'release_year': movie.get('release_year', 0)  # Integer\n    }\n\ndef calculate_feature_similarity(vec_a, vec_b):\n    \"\"\"\n    Calculate similarity between two feature vectors.\n    \n    Returns a 5-element numeric vector for cosine similarity calculation.\n    Each dimension is a similarity score [0, 1].\n    \"\"\"\n    # 1. Genre Match (binary: 1 if same, 0 otherwise)\n    genre_match = 1.0 if (vec_a['genre'] and vec_b['genre'] and \n                          vec_a['genre'] == vec_b['genre']) else 0.0\n    \n    # 2. Director Match (binary: 1 if same, 0 otherwise)\n    director_match = 1.0 if (vec_a['director'] and vec_b['director'] and \n                             vec_a['director'] == vec_b['director']) else 0.0\n    \n    # 3. Franchise Match (binary: 1 if same franchise, 0 otherwise)\n    franchise_match = 1.0 if (vec_a['franchise'] and vec_b['franchise'] and \n                              vec_a['franchise'] == vec_b['franchise']) else 0.0\n    \n    # 4. Budget Tier Similarity (0, 0.5, or 1.0)\n    budget_sim = calculate_budget_tier_similarity(\n        vec_a['budget_tier'], \n        vec_b['budget_tier']\n    )\n    \n    # 5. Year Proximity (exponential decay: 1.0 for same year, decreasing with distance)\n    year_prox = calculate_year_proximity(\n        vec_a['release_year'], \n        vec_b['release_year']\n    )\n    \n    # Return as numpy array for cosine similarity\n    return np.array([genre_match, director_match, franchise_match, budget_sim, year_prox])\n\ndef calculate_budget_tier_similarity(tier_a, tier_b):\n    \"\"\"\n    Calculate similarity between budget tiers.\n    \n    Budget tier ordering (from MONGODB_SCHEMAS.md):\n    - indie: Low-budget independent films\n    - mid: Mid-range budget films\n    - blockbuster: High-budget major productions\n    - unknown: Budget information not available\n    \n    Returns:\n        1.0 if same tier\n        0.5 if adjacent tiers (indie-mid, mid-blockbuster)\n        0.0 if non-adjacent or unknown\n    \"\"\"\n    if tier_a == tier_b:\n        return 1.0\n    \n    if tier_a == 'unknown' or tier_b == 'unknown':\n        return 0.0\n    \n    # Check if tiers are adjacent in the ordering\n    try:\n        idx_a = BUDGET_TIERS.index(tier_a)\n        idx_b = BUDGET_TIERS.index(tier_b)\n        \n        # Adjacent if difference is exactly 1\n        if abs(idx_a - idx_b) == 1:\n            return 0.5\n    except ValueError:\n        pass\n    \n    return 0.0\n\ndef calculate_year_proximity(year_a, year_b):\n    \"\"\"\n    Calculate proximity between release years using exponential decay.\n    \n    Formula: proximity = exp(-|year_diff| / decay_factor)\n    \n    Where:\n    - decay_factor = 5 years (half-life of similarity)\n    - Same year → 1.0\n    - 5 years apart → ~0.37 (e^-1)\n    - 10 years apart → ~0.14 (e^-2)\n    - 15 years apart → ~0.05 (e^-3)\n    \n    Returns:\n        Float [0, 1]: Year proximity score\n    \"\"\"\n    if not year_a or not year_b:\n        return 0.0\n    \n    year_diff = abs(year_a - year_b)\n    decay_factor = 5.0  # Years for similarity to decay to ~37%\n    \n    return exp(-year_diff / decay_factor)\n\ndef cosine_similarity(vec_a, vec_b):\n    \"\"\"\n    Calculate cosine similarity between two feature vectors.\n    \n    Formula: cos(θ) = (A · B) / (||A|| * ||B||)\n    \n    Args:\n        vec_a: Feature dict or numpy array\n        vec_b: Feature dict or numpy array\n    \n    Returns:\n        Float [-1, 1]: Cosine similarity (1 = identical, 0 = orthogonal, -1 = opposite)\n    \"\"\"\n    # Convert feature dicts to similarity vectors if needed\n    if isinstance(vec_a, dict):\n        vec_a = calculate_feature_similarity(vec_a, vec_b)\n        vec_b = calculate_feature_similarity(vec_b, vec_b)  # All 1s (self-similarity)\n    \n    # Calculate dot product\n    dot_product = np.dot(vec_a, vec_b)\n    \n    # Calculate magnitudes\n    magnitude_a = np.linalg.norm(vec_a)\n    magnitude_b = np.linalg.norm(vec_b)\n    \n    # Avoid division by zero\n    if magnitude_a == 0 or magnitude_b == 0:\n        return 0.0\n    \n    # Cosine similarity\n    return dot_product / (magnitude_a * magnitude_b)\n\ndef get_sentiment_boost(sentiment_a, sentiment_b):\n    \"\"\"\n    Calculate sentiment-aware boost multiplier.\n    \n    Sentiment range (from MONGODB_SCHEMAS.md): -1.0 to 1.0\n    - Positive sentiment: > 0.3\n    - Neutral: -0.3 to 0.3\n    - Negative sentiment: < -0.3\n    \n    Returns:\n        1.2 if both positive\n        1.0 if neutral\n        0.8 if either negative\n    \"\"\"\n    if sentiment_a is None or sentiment_b is None:\n        return 1.0\n    \n    both_positive = sentiment_a > 0.3 and sentiment_b > 0.3\n    either_negative = sentiment_a < -0.3 or sentiment_b < -0.3\n    \n    if both_positive:\n        return 1.2\n    elif either_negative:\n        return 0.8\n    else:\n        return 1.0\n```\n\n**Implementation:**\n\n```python\ndef get_similar_movies(movie_ids, limit=10, strategy=\"average\"):\n    \"\"\"\n    Args:\n        movie_ids: Single ID or list of IDs\n        limit: Number of recommendations\n        strategy: \"average\", \"union\", or \"intersection\"\n    \"\"\"\n    # Normalize to list\n    if isinstance(movie_ids, int):\n        movie_ids = [movie_ids]\n    \n    # Get target movies from movie_intelligence collection\n    targets = list(movie_intelligence.find({\"movie_id\": {\"$in\": movie_ids}}))\n    \n    if not targets:\n        raise ValueError(\"No valid movies found\")\n    \n    # Build target feature vectors\n    target_vecs = [build_feature_vector(movie) for movie in targets]\n    \n    # Get candidate movies (exclude input movies)\n    # Expand search to include genres and years from ALL target movies\n    search_criteria = {\"movie_id\": {\"$nin\": movie_ids}}\n    \n    if len(targets) == 1:\n        # Single movie: narrow search\n        target = targets[0]\n        search_criteria[\"$or\"] = [\n            {\"genre\": target.genre},\n            {\"release_year\": {\"$gte\": target.release_year - 3, \"$lte\": target.release_year + 3}}\n        ]\n    else:\n        # Multiple movies: broader search across all genres/years\n        all_genres = list(set([t.genre for t in targets if t.genre]))\n        all_years = [t.release_year for t in targets if t.release_year]\n        if all_years:\n            year_min = min(all_years) - 3\n            year_max = max(all_years) + 3\n            search_criteria[\"$or\"] = [\n                {\"genre\": {\"$in\": all_genres}},\n                {\"release_year\": {\"$gte\": year_min, \"$lte\": year_max}}\n            ]\n    \n    candidates = movie_intelligence.find(search_criteria)\n    \n    similarities = []\n    for candidate in candidates:\n        candidate_vec = build_feature_vector(candidate)\n        \n        # Calculate similarity based on strategy\n        if strategy == \"average\":\n            # Average approach: Create averaged preference vector\n            # Convert all target feature dicts to numeric similarity vectors relative to candidate\n            target_similarity_vecs = [\n                calculate_feature_similarity(tv, candidate_vec) \n                for tv in target_vecs\n            ]\n            # Average the similarity vectors\n            avg_similarity_vec = np.mean(target_similarity_vecs, axis=0)\n            # Compare against candidate's self-similarity (all 1s)\n            candidate_self_vec = calculate_feature_similarity(candidate_vec, candidate_vec)\n            sim = np.dot(avg_similarity_vec, candidate_self_vec) / (\n                np.linalg.norm(avg_similarity_vec) * np.linalg.norm(candidate_self_vec)\n            )\n            \n        elif strategy == \"union\":\n            # Max similarity to ANY target movie\n            sims = []\n            for tv in target_vecs:\n                similarity_vec = calculate_feature_similarity(tv, candidate_vec)\n                self_vec = calculate_feature_similarity(tv, tv)\n                sim_score = np.dot(similarity_vec, self_vec) / (\n                    np.linalg.norm(similarity_vec) * np.linalg.norm(self_vec)\n                )\n                sims.append(sim_score)\n            sim = max(sims)\n            \n        elif strategy == \"intersection\":\n            # Min similarity across ALL target movies\n            sims = []\n            for tv in target_vecs:\n                similarity_vec = calculate_feature_similarity(tv, candidate_vec)\n                self_vec = calculate_feature_similarity(tv, tv)\n                sim_score = np.dot(similarity_vec, self_vec) / (\n                    np.linalg.norm(similarity_vec) * np.linalg.norm(self_vec)\n                )\n                sims.append(sim_score)\n            sim = min(sims)\n        else:\n            raise ValueError(f\"Unknown strategy: {strategy}\")\n        \n        # Apply sentiment boost\n        if len(targets) == 1:\n            target_sentiment = get_current_sentiment(targets[0].movie_id)\n        else:\n            # Average sentiment across all target movies\n            target_sentiments = [get_current_sentiment(t.movie_id) for t in targets]\n            target_sentiment = np.mean([s for s in target_sentiments if s is not None])\n        \n        candidate_sentiment = get_current_sentiment(candidate.movie_id)\n        sentiment_boost = get_sentiment_boost(target_sentiment, candidate_sentiment)\n        \n        final_score = sim * sentiment_boost\n        \n        # Determine shared attributes with input movies\n        shared_genres = [t.genre for t in targets if t.genre == candidate.genre]\n        shared_genre = shared_genres[0] if shared_genres else None\n        \n        similarities.append({\n            \"movie_id\": candidate.movie_id,\n            \"movie_title\": candidate.title,\n            \"similarity_score\": round(final_score, 3),\n            \"shared_genre\": shared_genre,\n            \"release_year_diff\": min([abs(t.release_year - candidate.release_year) \n                                      for t in targets if t.release_year and candidate.release_year]),\n            \"popularity\": candidate.popularity,\n            \"vote_average\": candidate.vote_average,\n            \"vote_count\": candidate.vote_count,\n            \"matched_with\": len([t for t in targets \n                                if cosine_similarity(build_feature_vector(t), candidate_vec) > 0.5])\n                           if len(targets) > 1 else None  # How many input movies it matches\n        })\n    \n    # Sort by similarity score\n    return sorted(similarities, key=lambda x: x[\"similarity_score\"], reverse=True)[:limit]\n```\n\n**Response Schema (Multi-Movie Example):**\n```json\n{\n  \"input_movies\": [\n    {\"movie_id\": 299534, \"title\": \"Avengers: Endgame\"},\n    {\"movie_id\": 299536, \"title\": \"Avengers: Infinity War\"}\n  ],\n  \"strategy\": \"average\",\n  \"recommendations\": [\n    {\n      \"rank\": 1,\n      \"movie_id\": 271110,\n      \"movie_title\": \"Captain America: Civil War\",\n      \"similarity_score\": 0.892,\n      \"shared_genre\": \"Action\",\n      \"release_year_diff\": 3,\n      \"popularity\": 82.5,\n      \"vote_average\": 7.4,\n      \"vote_count\": 18500,\n      \"matched_with\": 2\n    }\n  ]\n}\n```\n\n#### 3.3 `GET /recommendations/reddit-buzz`\n\n**Purpose:** Pure Reddit buzz ranking (Reddit component only)\n\n**Reddit Buzz Score (Isolated):**\n```\nReddit_Score = weighted_engagement * recency_decay * volume_multiplier\n\nweighted_engagement:\n  W = upvotes + comments * 2 + awards * 10\n  where:\n    - awards = Reddit awards/gildings (high engagement signal)\n    - Note: crossposts data not available in speed_views\n\nrecency_decay:\n  decay = exp(-age_hours / 24)\n  where:\n    - Exponential decay with 24h half-life\n    - Prioritizes fresh discussions\n\nvolume_multiplier:\n  multiplier = 1 + log10(post_count + 1)\n  where:\n    - More data points = higher confidence\n    - log scale to prevent over-weighting\n    - Note: post_count is number of aggregated posts/comments in window\n```\n\n**Ranking:**\n```python\nreddit_rankings = []\n\n# Query MongoDB speed_views collection\ncutoff_time = datetime.utcnow() - timedelta(days=7)\nspeed_data = db.speed_views.find(\n    {\n        \"window_start\": {\"$gte\": cutoff_time}\n    }\n).sort(\"window_start\", -1)\n\nfor row in speed_data:\n    # Calculate weighted engagement from aggregated metrics\n    metrics = row['metrics']\n    W = (metrics['total_upvotes'] + \n         metrics['total_comments'] * 2 + \n         metrics['total_awards'] * 10)\n    \n    # Recency decay\n    age_hours = (datetime.utcnow() - row['window_start']).total_seconds() / 3600\n    decay = exp(-age_hours / 24)\n    \n    # Note: Cross-subreddit spread not available in speed_views aggregated data\n    # Using post_count as proxy for spread\n    multiplier = 1 + log10(metrics['post_count'] + 1) / 10  # Scaled down\n    \n    reddit_score = W * decay * multiplier\n    \n    reddit_rankings.append({\n        \"rank\": None,\n        \"movie_title\": row['movie_title'],\n        \"reddit_buzz_score\": round(reddit_score, 1),\n        \"total_engagement\": W,\n        \"post_count\": metrics['post_count'],\n        \"total_comments\": metrics['total_comments'],\n        \"hours_since_last_window\": round(age_hours, 1),\n        \"viral_score\": metrics['viral_score']  # From speed_views calculation\n    })\n\n# Sort and rank\nsorted_rankings = sorted(reddit_rankings, key=lambda x: x[\"reddit_buzz_score\"], reverse=True)\nfor i, item in enumerate(sorted_rankings):\n    item[\"rank\"] = i + 1\n\nreturn sorted_rankings[:limit]\n```\n\n#### 3.4 `GET /recommendations/tmdb-quality`\n\n**Purpose:** Pure TMDB quality ranking (TMDB component only)\n\n**TMDB Quality Score (Isolated):**\n```\nTMDB_Score = weighted_rating * popularity_factor * freshness_bonus\n\nweighted_rating (Bayesian average):\n  WR = (v / (v + m)) * R + (m / (v + m)) * C\n  where:\n    v = vote_count for the movie\n    m = minimum votes threshold (e.g., 100)\n    R = vote_average for the movie\n    C = mean vote across all movies (e.g., 7.0)\n  \n  This prevents movies with few votes from ranking too high\n\npopularity_factor:\n  P = log10(vote_count + 1) / 6\n  Normalized to [0, 1] range\n  Assumption: max vote_count ≈ 1M (log10(1M) ≈ 6)\n\nfreshness_bonus (for recent releases):\n  bonus = {\n    1.1 if released in last 6 months\n    1.05 if released in last 1 year\n    1.0 otherwise\n  }\n\nFinal Score:\n  TMDB_Score = WR * (0.7 + 0.3 * P) * freshness_bonus\n  Result range: approximately [0, 10]\n```\n\n**Ranking:**\n```python\ntmdb_rankings = []\n\n# Calculate mean rating across dataset\nC = movie_intelligence.aggregate([{\"$group\": {\"_id\": null, \"avg\": {\"$avg\": \"$vote_average\"}}}])[0][\"avg\"]\nm = 100  # Minimum votes threshold\n\nfor movie in movie_intelligence.find({\"vote_count\": {\"$gte\": m}}):\n    v = movie.vote_count\n    R = movie.vote_average\n    \n    # Weighted rating (Bayesian average)\n    WR = (v / (v + m)) * R + (m / (v + m)) * C\n    \n    # Popularity factor\n    P = log10(v + 1) / 6\n    \n    # Freshness bonus\n    months_since_release = (now - movie.release_date).days / 30\n    if months_since_release <= 6:\n        freshness_bonus = 1.1\n    elif months_since_release <= 12:\n        freshness_bonus = 1.05\n    else:\n        freshness_bonus = 1.0\n    \n    # Final score\n    tmdb_score = WR * (0.7 + 0.3 * P) * freshness_bonus\n    \n    tmdb_rankings.append({\n        \"rank\": None,\n        \"movie_id\": movie.movie_id,\n        \"movie_title\": movie.title,\n        \"genre\": movie.genre,  # ✅ Correct field: 'genre' not 'genres'\n        \"tmdb_quality_score\": round(tmdb_score, 2),\n        \"vote_average\": R,\n        \"vote_count\": v,\n        \"weighted_rating\": round(WR, 2),\n        \"popularity_factor\": round(P, 3),\n        \"release_date\": movie.release_date\n    })\n\n# Sort by TMDB quality score\nsorted_rankings = sorted(tmdb_rankings, key=lambda x: x[\"tmdb_quality_score\"], reverse=True)\nfor i, item in enumerate(sorted_rankings):\n    item[\"rank\"] = i + 1\n\nreturn sorted_rankings[:limit]\n```\n\n---\n\n### Utility Endpoints - Mathematical Definitions\n\n#### U.1 `GET /utilities/movies/{id}`\n\n**Purpose:** Merge batch and speed layer data for complete movie view\n\n**Merge Logic (48-hour cutoff):**\n```python\ndef get_movie_details(movie_id):\n    # Get batch layer data (always present)\n    batch_data = movie_intelligence.find_one({\"movie_id\": movie_id})\n    \n    # Get speed layer data (if exists)\n    speed_data = speed_layer.find_one({\n        \"movie_id\": movie_id,\n        \"last_discussion_time\": {\"$gte\": now - 48h}\n    })\n    \n    # Merge strategy\n    merged = {\n        # TMDB fields (from batch layer)\n        \"movie_id\": batch_data.movie_id,\n        \"title\": batch_data.title,\n        \"genre\": batch_data.genre,\n        \"release_date\": batch_data.release_date,\n        \"vote_average\": batch_data.vote_average,\n        \"vote_count\": batch_data.vote_count,\n        \n        # Sentiment (speed layer if fresh, else batch)\n        \"avg_sentiment\": speed_data['metrics']['avg_sentiment'] if speed_data else batch_data.avg_sentiment,\n        \"sentiment_source\": \"speed_layer\" if speed_data else \"batch_layer\",\n        \n        # Reddit metrics (speed layer aggregated data only)\n        \"reddit_metrics\": {\n            \"total_upvotes\": speed_data['metrics']['total_upvotes'] if speed_data else 0,\n            \"total_comments\": speed_data['metrics']['total_comments'] if speed_data else 0,\n            \"total_awards\": speed_data['metrics']['total_awards'] if speed_data else 0,\n            \"viral_score\": speed_data['metrics']['viral_score'] if speed_data else 0,\n            \"last_window\": speed_data['window_start'] if speed_data else None,\n            \"data_type\": speed_data['data_type'] if speed_data else None\n        },\n        \n        # Additional batch layer metadata\n        \"popularity\": batch_data.popularity,\n        \"budget_tier\": batch_data.budget_tier,\n        \"director\": batch_data.director,\n        \"runtime\": batch_data.runtime\n    }\n    \n    return merged\n```\n\n#### U.2 `GET /utilities/search`\n\n**Purpose:** Search movies with text matching and filters\n\n**Search Algorithm:**\n```python\ndef search_movies(q, genre, year_from, year_to, limit):\n    query_filters = []\n    \n    # Text search (if provided)\n    if q:\n        query_filters.append({\n            \"$or\": [\n                {\"title\": {\"$regex\": q, \"$options\": \"i\"}},  # Case-insensitive title search\n                {\"director\": {\"$regex\": q, \"$options\": \"i\"}},  # Search by director\n                {\"franchise\": {\"$regex\": q, \"$options\": \"i\"}}  # Search by franchise\n            ]\n        })\n    \n    # Genre filter\n    if genre:\n        query_filters.append({\"genre\": genre})  # Direct string match\n    \n    # Year range filter\n    if year_from or year_to:\n        year_filter = {}\n        if year_from:\n            year_filter[\"$gte\"] = year_from\n        if year_to:\n            year_filter[\"$lte\"] = year_to\n        query_filters.append({\"release_year\": year_filter})\n    \n    # Combine filters\n    final_query = {\"$and\": query_filters} if query_filters else {}\n    \n    # Execute search with ranking\n    results = movie_intelligence.find(final_query).sort([\n        (\"vote_average\", -1),  # Higher rated first\n        (\"vote_count\", -1)     # More popular second\n    ]).limit(limit)\n    \n    return list(results)\n```\n\n---\n\n### Summary: Key Formulas Quick Reference\n\n| Endpoint | Primary Formula | Range |\n|----------|----------------|-------|\n| Crisis Detection | `σ = (S_current - S_baseline) / σ_baseline` | -∞ to +∞ (crisis if < -3.0) |\n| Viral Coefficient | `V = velocity / threshold` | 0 to ∞ (viral if > 1.0) |\n| Dual-Success Score | `D = 0.6 * Reddit_Score + 0.4 * TMDB_Score` | 0 to 100 |\n| TMDB Score | `0.5*pop + 0.3*(vote_avg*10) + 0.2*log₁₀(vote_count)` | Normalized 0-100 |\n| Cosine Similarity | `sim = vec_A · vec_B / (‖vec_A‖ * ‖vec_B‖)` | -1 to 1 |\n| Reddit Buzz | `R = W * exp(-t/24) * (1 + log₁₀(post_count))` | 0 to ∞ |\n| TMDB Quality | `Q = WR * (0.7 + 0.3P) * freshness_bonus` | 0 to 10 |\n\n---\n\n## \U0001F504 API Route Migration Mapping\n\n### Current → New Mapping\n\n| Current Route | New Route | Goal | Notes |\n|---------------|-----------|------|-------|\n| `GET /movies/{id}/sentiment` | `GET /crisis-detection/movies/{id}/sentiment` | #1 | Direct move |\n| `GET /movies/by-title/{title}/sentiment` | `GET /crisis-detection/movies/by-title/{title}/sentiment` | #1 | Direct move |\n| *(new)* | `GET /crisis-detection/alerts` | #1 | List active crisis alerts |\n| *(new)* | `GET /crisis-detection/baselines/genre/{genre}` | #1 | Get genre sentiment baseline |\n| *(new)* | `GET /crisis-detection/monitoring` | #1 | Dashboard data endpoint |\n| `GET /trending/movies` | `GET /viral-detection/trending` | #2 | Rename for clarity |\n| *(new)* | `GET /viral-detection/movies/{id}/viral-score` | #2 | Get movie's viral coefficient |\n| *(new)* | `GET /viral-detection/thresholds` | #2 | Get viral thresholds by context |\n| *(new)* | `GET /viral-detection/opportunities` | #2 | Marketing opportunities |\n| `GET /recommendations` | `GET /recommendations/dual-success` | #3 | Explicit dual-success naming |\n| `GET /recommendations/movies/{id}/similar` | `GET /recommendations/similar/{id}` | #3 | Shorter path |\n| `GET /recommendations/genres/{genre}` | `GET /recommendations/dual-success/genre/{genre}` | #3 | Clearer hierarchy |\n| *(new)* | `GET /recommendations/reddit-buzz` | #3 | Reddit-only ranking |\n| *(new)* | `GET /recommendations/tmdb-quality` | #3 | TMDB-only ranking |\n| `GET /movies/{id}` | `GET /utilities/movies/{id}` | - | Support endpoint |\n| `GET /search/movies` | `GET /utilities/search` | - | Support endpoint |\n\n---\n\n## \U0001F4CA Dashboard Reorganization (Goal-Aligned)\n\n### New Dashboard Structure\n\n```\ngrafana/dashboards/\n├── 1-crisis-detection.json           # \U0001F6A8 GOAL #1: PR Crisis Detection\n├── 2-viral-content.json              # \U0001F525 GOAL #2: Viral Content  \n├── 3-recommendation-performance.json # \U0001F3AF GOAL #3: Recommendations\n└── 4-system-health.json              # System monitoring\n```\n\n---\n\n## \U0001F4CB Dashboard #1: PR Crisis Detection & Sentiment Monitoring\n\n**File:** `1-crisis-detection.json`  \n**Goal:** Goal #1 - Detect sentiment drops > 3σ below baseline\n\n### API Endpoints Used\n\n| Endpoint | Purpose | Panel(s) |\n|----------|---------|----------|\n| `GET /crisis-detection/alerts` | List active crisis alerts | Crisis Alerts Summary, Active Alerts Table |\n| `GET /crisis-detection/movies/{id}/sentiment` | Movie sentiment details | Current Sentiment Score, Sentiment vs Baseline |\n| `GET /crisis-detection/baselines/genre/{genre}` | Genre baseline comparison | Sentiment by Genre Baseline |\n| `GET /crisis-detection/monitoring` | Real-time monitoring data | Sentiment Velocity, Movies in Crisis State |\n| Prometheus: `crisis_alerts_total` | Crisis alert counter | Crisis Count Gauge, Alerts by Severity |\n| Prometheus: `sentiment_score` | Current sentiment from Reddit | Real-time Sentiment Gauge |\n| Prometheus: `sentiment_baseline` | Historical baseline from TMDB | Baseline Comparison Chart |\n| Prometheus: `movies_in_crisis` | Count of movies in crisis | Crisis State Counter |\n\n### Dashboard Panels\n\n#### Row 1: KPI Summary (Single Stats)\n```json\n[\n  {\n    \"title\": \"Movies in Crisis\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"sum(movies_in_crisis)\",\n    \"thresholds\": [0, 1, 5],\n    \"colors\": [\"green\", \"yellow\", \"red\"]\n  },\n  {\n    \"title\": \"Critical Alerts (24h)\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"increase(crisis_alerts_total{severity='critical'}[24h])\",\n    \"thresholds\": [0, 1, 3]\n  },\n  {\n    \"title\": \"Average Sentiment Score\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"avg(sentiment_score)\",\n    \"decimals\": 2,\n    \"unit\": \"none\"\n  },\n  {\n    \"title\": \"Avg Response Time\",\n    \"type\": \"stat\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/crisis-detection/monitoring\",\n    \"field\": \"avg_response_time_minutes\",\n    \"unit\": \"m\"\n  }\n]\n```\n\n#### Row 2: Sentiment Trends (Time Series)\n```json\n[\n  {\n    \"title\": \"Sentiment vs Baseline Over Time\",\n    \"type\": \"timeseries\",\n    \"datasource\": \"Prometheus\",\n    \"queries\": [\n      {\n        \"expr\": \"sentiment_score{movie_id='$movie_id'}\",\n        \"legendFormat\": \"Current Sentiment\"\n      },\n      {\n        \"expr\": \"sentiment_baseline{movie_id='$movie_id'}\",\n        \"legendFormat\": \"Baseline\"\n      },\n      {\n        \"expr\": \"sentiment_baseline{movie_id='$movie_id'} - 3 * stddev(sentiment_score{movie_id='$movie_id'})\",\n        \"legendFormat\": \"Crisis Threshold (-3σ)\"\n      }\n    ],\n    \"span\": 12\n  }\n]\n```\n\n#### Row 3: Crisis Analytics\n```json\n[\n  {\n    \"title\": \"Sentiment Velocity (Change Rate)\",\n    \"type\": \"graph\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"rate(sentiment_score[1h])\",\n    \"span\": 6\n  },\n  {\n    \"title\": \"Crisis Severity Breakdown\",\n    \"type\": \"piechart\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"sum by (severity) (crisis_alerts_total)\",\n    \"span\": 6\n  }\n]\n```\n\n#### Row 4: Active Crisis Monitoring\n```json\n[\n  {\n    \"title\": \"Movies in Crisis State\",\n    \"type\": \"table\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/crisis-detection/alerts\",\n    \"columns\": [\n      {\"field\": \"movie_title\", \"header\": \"Movie\"},\n      {\"field\": \"current_sentiment\", \"header\": \"Current\"},\n      {\"field\": \"baseline_sentiment\", \"header\": \"Baseline\"},\n      {\"field\": \"deviation_sigma\", \"header\": \"σ Deviation\"},\n      {\"field\": \"severity\", \"header\": \"Severity\"},\n      {\"field\": \"alert_timestamp\", \"header\": \"Alert Time\"}\n    ],\n    \"span\": 12\n  }\n]\n```\n\n#### Row 5: Baseline Comparisons\n```json\n[\n  {\n    \"title\": \"Sentiment by Genre Baseline\",\n    \"type\": \"bargauge\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/crisis-detection/baselines/genre/$genre\",\n    \"field\": \"avg_sentiment\",\n    \"span\": 6\n  },\n  {\n    \"title\": \"Top 5 Sentiment Drops\",\n    \"type\": \"table\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/crisis-detection/alerts?sort=deviation&limit=5\",\n    \"span\": 6\n  }\n]\n```\n\n### Dashboard Variables\n```json\n{\n  \"variables\": [\n    {\n      \"name\": \"movie_id\",\n      \"type\": \"custom\",\n      \"query\": \"298618,402431,748783\",\n      \"label\": \"Movie\",\n      \"multi\": false\n    },\n    {\n      \"name\": \"genre\",\n      \"type\": \"query\",\n      \"datasource\": \"Infinity\",\n      \"query\": \"/utilities/genres\",\n      \"label\": \"Genre\"\n    },\n    {\n      \"name\": \"severity\",\n      \"type\": \"custom\",\n      \"options\": [\"all\", \"warning\", \"critical\"],\n      \"label\": \"Severity Filter\"\n    }\n  ]\n}\n```\n\n---\n\n## \U0001F4CB Dashboard #2: Viral Content Identification & Tracking\n\n**File:** `2-viral-content.json`  \n**Goal:** Goal #2 - Identify viral content for marketing amplification\n\n### API Endpoints Used\n\n| Endpoint | Purpose | Panel(s) |\n|----------|---------|----------|\n| `GET /viral-detection/trending` | Top viral movies | Viral Movies Ranking Table |\n| `GET /viral-detection/movies/{id}/viral-score` | Movie viral coefficient | Viral Coefficient Gauge |\n| `GET /viral-detection/thresholds` | Viral thresholds by context | Threshold Comparison Charts |\n| `GET /viral-detection/opportunities` | Marketing opportunities | Opportunities Table |\n| Prometheus: `viral_detections_total` | Viral detection counter | Viral Movies Count |\n| Prometheus: `upvote_velocity` | Reddit upvote rate | Engagement Velocity Chart |\n| Prometheus: `comment_velocity` | Reddit comment rate | Engagement Velocity Chart |\n| Prometheus: `viral_coefficient` | Viral score metric | Viral Coefficient Over Time |\n\n### Dashboard Panels\n\n#### Row 1: KPI Summary\n```json\n[\n  {\n    \"title\": \"Viral Movies (>1.0)\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"count(viral_coefficient > 1.0)\",\n    \"thresholds\": [0, 5, 10],\n    \"colors\": [\"red\", \"yellow\", \"green\"]\n  },\n  {\n    \"title\": \"Avg Viral Coefficient\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"avg(viral_coefficient)\",\n    \"decimals\": 2\n  },\n  {\n    \"title\": \"Total Reddit Engagement\",\n    \"type\": \"stat\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/viral-detection/trending?limit=1\",\n    \"field\": \"total_upvotes\",\n    \"unit\": \"upvotes\"\n  },\n  {\n    \"title\": \"Marketing Opportunities\",\n    \"type\": \"stat\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/viral-detection/opportunities\",\n    \"field\": \"count\"\n  }\n]\n```\n\n#### Row 2: Viral Coefficient Tracking\n```json\n[\n  {\n    \"title\": \"Viral Coefficient Over Time\",\n    \"type\": \"timeseries\",\n    \"datasource\": \"Prometheus\",\n    \"queries\": [\n      {\n        \"expr\": \"viral_coefficient{movie_id='$movie_id'}\",\n        \"legendFormat\": \"{{movie_title}}\"\n      },\n      {\n        \"expr\": \"1.0\",\n        \"legendFormat\": \"Viral Threshold\"\n      },\n      {\n        \"expr\": \"1.5\",\n        \"legendFormat\": \"High Viral Threshold\"\n      }\n    ],\n    \"span\": 12\n  }\n]\n```\n\n#### Row 3: Engagement Metrics\n```json\n[\n  {\n    \"title\": \"Upvote Velocity\",\n    \"type\": \"graph\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"rate(upvote_velocity{genre='$genre'}[1h])\",\n    \"span\": 6\n  },\n  {\n    \"title\": \"Comment Velocity\",\n    \"type\": \"graph\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"rate(comment_velocity{genre='$genre'}[1h])\",\n    \"span\": 6\n  }\n]\n```\n\n#### Row 4: Viral Spread Heatmap\n```json\n[\n  {\n    \"title\": \"Cross-Subreddit Spread Heatmap\",\n    \"type\": \"heatmap\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/viral-detection/trending?limit=20\",\n    \"xField\": \"movie_title\",\n    \"yField\": \"subreddit_name\",\n    \"valueField\": \"engagement_score\",\n    \"span\": 12\n  }\n]\n```\n\n#### Row 5: Viral Movies Ranking\n```json\n[\n  {\n    \"title\": \"Top 10 Viral Movies\",\n    \"type\": \"table\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/viral-detection/trending?limit=10\",\n    \"columns\": [\n      {\"field\": \"rank\", \"header\": \"#\"},\n      {\"field\": \"movie_title\", \"header\": \"Movie\"},\n      {\"field\": \"genre\", \"header\": \"Genre\"},\n      {\"field\": \"viral_coefficient\", \"header\": \"Viral Coeff\"},\n      {\"field\": \"upvote_velocity\", \"header\": \"Upvotes/h\"},\n      {\"field\": \"comment_velocity\", \"header\": \"Comments/h\"},\n      {\"field\": \"viral_score\", \"header\": \"Viral Score\"},\n      {\"field\": \"viral_status\", \"header\": \"Status\"}\n    ],\n    \"span\": 8\n  },\n  {\n    \"title\": \"Viral Status Breakdown\",\n    \"type\": \"piechart\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/viral-detection/trending?limit=50\",\n    \"field\": \"viral_status\",\n    \"span\": 4\n  }\n]\n```\n\n#### Row 6: Marketing Opportunities\n```json\n[\n  {\n    \"title\": \"Marketing Amplification Opportunities\",\n    \"type\": \"table\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/viral-detection/opportunities\",\n    \"columns\": [\n      {\"field\": \"movie_title\", \"header\": \"Movie\"},\n      {\"field\": \"viral_coefficient\", \"header\": \"Viral Coeff\"},\n      {\"field\": \"opportunity_score\", \"header\": \"Opportunity\"},\n      {\"field\": \"recommended_action\", \"header\": \"Action\"},\n      {\"field\": \"estimated_reach\", \"header\": \"Est. Reach\"}\n    ],\n    \"span\": 12\n  }\n]\n```\n\n### Dashboard Variables\n```json\n{\n  \"variables\": [\n    {\n      \"name\": \"genre\",\n      \"type\": \"query\",\n      \"datasource\": \"Infinity\",\n      \"query\": \"/utilities/genres\",\n      \"includeAll\": true,\n      \"label\": \"Genre\"\n    },\n    {\n      \"name\": \"viral_threshold\",\n      \"type\": \"custom\",\n      \"options\": [\"0.5\", \"1.0\", \"1.5\", \"2.0\"],\n      \"current\": \"1.0\",\n      \"label\": \"Min Viral Coefficient\"\n    },\n    {\n      \"name\": \"time_window\",\n      \"type\": \"custom\",\n      \"options\": [\"6h\", \"12h\", \"24h\", \"48h\"],\n      \"current\": \"48h\",\n      \"label\": \"Time Window\"\n    }\n  ]\n}\n```\n\n---\n\n## \U0001F4CB Dashboard #3: Recommendation Performance & Optimization\n\n**File:** `3-recommendation-performance.json`  \n**Goal:** Goal #3 - Optimize dual-success recommendations (60% Reddit + 40% TMDB)\n\n### API Endpoints Used\n\n| Endpoint | Purpose | Panel(s) |\n|----------|---------|----------|\n| `GET /recommendations/dual-success` | Dual-success recommendations | Top Recommendations Table |\n| `GET /recommendations/dual-success/genre/{genre}` | Genre-filtered recommendations | Genre Performance |\n| `GET /recommendations/reddit-buzz` | Reddit-only rankings | Reddit Component Analysis |\n| `GET /recommendations/tmdb-quality` | TMDB-only rankings | TMDB Component Analysis |\n| `GET /recommendations/similar/{id}` | Content similarity | Similar Movies Panel |\n| Prometheus: `recommendation_requests_total` | Request counter | Recommendations Served |\n| Prometheus: `dual_success_score` | Dual-success score histogram | Score Distribution |\n| Prometheus: `http_request_duration_seconds{endpoint=\"/recommendations\"}` | Response time | Performance Metrics |\n\n### Dashboard Panels\n\n#### Row 1: KPI Summary\n```json\n[\n  {\n    \"title\": \"Total Recommendations (24h)\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"increase(recommendation_requests_total[24h])\",\n    \"unit\": \"short\"\n  },\n  {\n    \"title\": \"Avg Dual-Success Score\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"histogram_quantile(0.50, dual_success_score_bucket)\",\n    \"decimals\": 1,\n    \"thresholds\": [0, 60, 80]\n  },\n  {\n    \"title\": \"Cache Hit Rate\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"rate(cache_hits_total{endpoint='/recommendations'}[5m]) / rate(cache_requests_total{endpoint='/recommendations'}[5m])\",\n    \"unit\": \"percentunit\",\n    \"decimals\": 1\n  },\n  {\n    \"title\": \"P95 Response Time\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{endpoint='/recommendations'}[5m]))\",\n    \"unit\": \"s\",\n    \"thresholds\": [0, 0.2, 0.5]\n  }\n]\n```\n\n#### Row 2: Dual-Success Score Distribution\n```json\n[\n  {\n    \"title\": \"Dual-Success Score Distribution\",\n    \"type\": \"histogram\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"dual_success_score\",\n    \"bucketSize\": 10,\n    \"xAxisLabel\": \"Dual-Success Score (0-100)\",\n    \"yAxisLabel\": \"Count\",\n    \"span\": 12\n  }\n]\n```\n\n#### Row 3: Component Analysis\n```json\n[\n  {\n    \"title\": \"Reddit vs TMDB Component Scatter Plot\",\n    \"type\": \"scatter\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/recommendations/dual-success?limit=100\",\n    \"xField\": \"tmdb_quality_score\",\n    \"yField\": \"reddit_buzz_score\",\n    \"sizeField\": \"dual_success_score\",\n    \"span\": 8\n  },\n  {\n    \"title\": \"Algorithm Weight Breakdown\",\n    \"type\": \"piechart\",\n    \"datasource\": \"Custom\",\n    \"data\": [\n      {\"name\": \"Reddit Buzz (60%)\", \"value\": 60},\n      {\"name\": \"TMDB Quality (40%)\", \"value\": 40}\n    ],\n    \"span\": 4\n  }\n]\n```\n\n#### Row 4: Recommendations by Genre\n```json\n[\n  {\n    \"title\": \"Recommendations Served by Genre (24h)\",\n    \"type\": \"barchart\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"sum by (genre) (increase(recommendation_requests_total[24h]))\",\n    \"span\": 12\n  }\n]\n```\n\n#### Row 5: Top Recommendations\n```json\n[\n  {\n    \"title\": \"Top 20 Dual-Success Recommendations\",\n    \"type\": \"table\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/recommendations/dual-success?limit=20\",\n    \"columns\": [\n      {\"field\": \"rank\", \"header\": \"#\"},\n      {\"field\": \"movie_title\", \"header\": \"Movie\"},\n      {\"field\": \"genres\", \"header\": \"Genres\"},\n      {\"field\": \"dual_success_score\", \"header\": \"Dual Score\"},\n      {\"field\": \"reddit_buzz_score\", \"header\": \"Reddit (60%)\"},\n      {\"field\": \"tmdb_quality_score\", \"header\": \"TMDB (40%)\"},\n      {\"field\": \"vote_average\", \"header\": \"Rating\"},\n      {\"field\": \"reddit_mentions\", \"header\": \"Reddit Mentions\"}\n    ],\n    \"span\": 12\n  }\n]\n```\n\n#### Row 6: Performance Monitoring\n```json\n[\n  {\n    \"title\": \"Speed Layer Freshness\",\n    \"type\": \"gauge\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/recommendations/dual-success?limit=100\",\n    \"query\": \"count(speed_layer_contribution > 0) / count(*) * 100\",\n    \"unit\": \"%\",\n    \"thresholds\": [0, 20, 50],\n    \"span\": 4\n  },\n  {\n    \"title\": \"Recommendation Diversity (Genre Entropy)\",\n    \"type\": \"stat\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/recommendations/dual-success?limit=100\",\n    \"calculation\": \"entropy(genres)\",\n    \"decimals\": 2,\n    \"span\": 4\n  },\n  {\n    \"title\": \"Dual-Success Score by Genre\",\n    \"type\": \"bargauge\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/recommendations/dual-success/genre/$genre?limit=10\",\n    \"field\": \"avg_dual_success_score\",\n    \"span\": 4\n  }\n]\n```\n\n### Dashboard Variables\n```json\n{\n  \"variables\": [\n    {\n      \"name\": \"genre\",\n      \"type\": \"query\",\n      \"datasource\": \"Infinity\",\n      \"query\": \"/utilities/genres\",\n      \"includeAll\": true,\n      \"label\": \"Genre\"\n    },\n    {\n      \"name\": \"min_rating\",\n      \"type\": \"custom\",\n      \"options\": [\"0\", \"6.0\", \"7.0\", \"8.0\"],\n      \"current\": \"6.0\",\n      \"label\": \"Min TMDB Rating\"\n    },\n    {\n      \"name\": \"limit\",\n      \"type\": \"custom\",\n      \"options\": [\"10\", \"20\", \"50\", \"100\"],\n      \"current\": \"20\",\n      \"label\": \"Results Limit\"\n    }\n  ]\n}\n```\n\n---\n\n## \U0001F4CB Dashboard #4: System Health & Infrastructure\n\n**File:** `4-system-health.json`  \n**Purpose:** Monitor API, MongoDB, Redis, and data pipeline health\n\n### API Endpoints Used\n\n| Endpoint | Purpose | Panel(s) |\n|----------|---------|----------|\n| `GET /health` | System health status | Overall Health Status |\n| Prometheus: `up{job=\"fastapi\"}` | API availability | API Uptime |\n| Prometheus: `http_requests_total` | Request metrics | Request Rate, Success Rate |\n| Prometheus: `http_request_duration_seconds` | Latency metrics | Response Time |\n| Prometheus: `mongodb_connections` | MongoDB health | DB Connections |\n| Prometheus: `redis_keyspace_hits_total` | Cache metrics | Cache Hit Rate |\n\n### Dashboard Panels\n\n#### Row 1: System Status\n```json\n[\n  {\n    \"title\": \"API Uptime\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"avg_over_time(up{job='fastapi'}[24h]) * 100\",\n    \"unit\": \"percent\",\n    \"decimals\": 2,\n    \"thresholds\": [0, 99, 99.9]\n  },\n  {\n    \"title\": \"Request Rate\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"rate(http_requests_total[5m])\",\n    \"unit\": \"reqps\"\n  },\n  {\n    \"title\": \"P95 Latency\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))\",\n    \"unit\": \"s\",\n    \"thresholds\": [0, 0.1, 0.2]\n  },\n  {\n    \"title\": \"Error Rate\",\n    \"type\": \"stat\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"rate(http_requests_total{status=~'5..'}[5m]) / rate(http_requests_total[5m]) * 100\",\n    \"unit\": \"percent\",\n    \"thresholds\": [0, 1, 5]\n  }\n]\n```\n\n#### Row 2: Request Rate by Goal\n```json\n[\n  {\n    \"title\": \"API Request Rate by Business Goal\",\n    \"type\": \"timeseries\",\n    \"datasource\": \"Prometheus\",\n    \"queries\": [\n      {\n        \"expr\": \"rate(http_requests_total{endpoint=~'/crisis-detection.*'}[5m])\",\n        \"legendFormat\": \"Goal #1: Crisis Detection\"\n      },\n      {\n        \"expr\": \"rate(http_requests_total{endpoint=~'/viral-detection.*'}[5m])\",\n        \"legendFormat\": \"Goal #2: Viral Detection\"\n      },\n      {\n        \"expr\": \"rate(http_requests_total{endpoint=~'/recommendations.*'}[5m])\",\n        \"legendFormat\": \"Goal #3: Recommendations\"\n      },\n      {\n        \"expr\": \"rate(http_requests_total{endpoint=~'/utilities.*'}[5m])\",\n        \"legendFormat\": \"Utilities\"\n      }\n    ],\n    \"span\": 12\n  }\n]\n```\n\n#### Row 3: Database & Cache Health\n```json\n[\n  {\n    \"title\": \"MongoDB Latency\",\n    \"type\": \"graph\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"mongodb_query_latency_seconds\",\n    \"span\": 6\n  },\n  {\n    \"title\": \"Redis Cache Hit Rate\",\n    \"type\": \"graph\",\n    \"datasource\": \"Prometheus\",\n    \"query\": \"rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))\",\n    \"span\": 6\n  }\n]\n```\n\n#### Row 4: Data Freshness\n```json\n[\n  {\n    \"title\": \"Batch Layer Last Update\",\n    \"type\": \"stat\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/health\",\n    \"field\": \"batch_layer_last_update\",\n    \"unit\": \"dateTimeFromNow\"\n  },\n  {\n    \"title\": \"Speed Layer Last Update\",\n    \"type\": \"stat\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/health\",\n    \"field\": \"speed_layer_last_update\",\n    \"unit\": \"dateTimeFromNow\"\n  },\n  {\n    \"title\": \"Total Movies (Batch)\",\n    \"type\": \"stat\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/health\",\n    \"field\": \"batch_layer_movie_count\"\n  },\n  {\n    \"title\": \"Active Discussions (Speed)\",\n    \"type\": \"stat\",\n    \"datasource\": \"Infinity\",\n    \"endpoint\": \"/health\",\n    \"field\": \"speed_layer_movie_count\"\n  }\n]\n```\n\n---\n\n### Additional Schema Notes\n\n#### ✅ Compatible Fields (No Action Needed)\n\n1. **Sentiment Range:** All layers use -1.0 to 1.0 (Float in Cassandra, Double in MongoDB)\n2. **Timestamp Formats:** API can parse both ISO 8601 strings (batch) and Cassandra timestamps (speed)\n3. **Viral Score:** Speed layer calculates using batch layer thresholds (complementary, not conflicting)\n\n#### ⚠️ Baseline Selection Priority\n\nWhen querying `sentiment_baselines`, use **priority-based fallback**:\n\n```python\ndef get_sentiment_baseline(movie):\n    \"\"\"\n    Get sentiment baseline with priority: franchise > genre > year.\n    \n    Args:\n        movie: Movie document from movie_intelligence\n        \n    Returns:\n        dict: Baseline document with type metadata\n    \"\"\"\n    # Priority 1: Franchise baseline (most specific)\n    if movie.get(\"franchise\"):\n        baseline = sentiment_baselines.find_one({\n            \"franchise\": movie.get(\"franchise\"),\n            \"genre\": None,\n            \"year\": None\n        })\n        if baseline:\n            return {**baseline, \"baseline_type\": \"franchise\"}\n    \n    # Priority 2: Genre baseline\n    primary_genre = get_primary_genre(movie)  # ✅ Handle array type\n    if primary_genre:\n        baseline = sentiment_baselines.find_one({\n            \"genre\": primary_genre,\n            \"franchise\": None,\n            \"year\": None\n        })\n        if baseline:\n            return {**baseline, \"baseline_type\": \"genre\"}\n    \n    # Priority 3: Yearly baseline (least specific)\n    if movie.get(\"release_year\"):\n        baseline = sentiment_baselines.find_one({\n            \"year\": movie.get(\"release_year\"),\n            \"genre\": None,\n            \"franchise\": None\n        })\n        if baseline:\n            return {**baseline, \"baseline_type\": \"yearly\"}\n    \n    # No baseline found\n    return None\n```\n\n**Where to Apply:**\n- ✅ `/crisis-detection/movies/{id}/sentiment` - Baseline selection\n- ✅ `/crisis-detection/alerts` - Batch crisis detection\n\n---\n\n### Implementation Checklist\n\n**Before API Development:**\n- [ ] Create `layers/serving_layer/query_engine/utils.py` with helper functions\n- [ ] Add `normalize_movie_title()` function\n- [ ] Add `get_sentiment_baseline()` function with priority fallback\n- [ ] Add `merge_batch_speed_data()` function with 48h cutoff\n- [ ] Write unit tests for edge cases (title normalization, baseline fallback)\n\n**During API Development:**\n- [ ] Use `normalize_movie_title()` whenever querying speed layer by title\n- [ ] Use `merge_batch_speed_data()` for endpoints that need real-time data\n- [ ] Document data source in API responses (`\"data_source\": \"speed_layer\" | \"batch_layer\"`)\n- [ ] Use direct genre string comparison (no array handling needed)\n- [ ] Add logging for title normalization mismatches\n\n**Testing:**\n- [ ] Test title normalization with edge cases:\n  - \"The Flash (2023)\" ✅ matches \"the flash\"\n  - \"Spider-Man: No Way Home\" ✅ matches \"spiderman no way home\"\n  - \"The Matrix!!!\" ✅ matches \"matrix\"\n  - \"The Batman\" ✅ matches \"batman, the\"\n- [ ] Test batch-speed merge with various data ages:\n  - Fresh data (< 1h old): Use speed layer\n  - Stale data (> 48h old): Use batch layer\n  - No speed data: Fallback to batch layer\n- [ ] Test baseline priority fallback:\n  - MCU movie → franchise baseline\n  - Non-franchise Action movie → genre baseline\n  - Old classic → yearly baseline\n  - Edge case → global baseline\n\n---\n\n## �\U0001F680 Implementation Plan\n\n### Phase 1: API Route Refactoring (Day 1-2)\n\n#### Step 1: Create New Route Files\n```bash\nlayers/serving_layer/api/routes/\n├── __init__.py (update imports)\n├── health.py (keep as-is)\n├── crisis_detection.py (NEW - Goal #1)\n├── viral_detection.py (NEW - Goal #2)\n├── recommendations.py (refactor existing)\n└── utilities.py (NEW - supporting endpoints)\n\n# Archive old files\nlayers/serving_layer/api/routes/archive/\n├── movies.py (old)\n├── trending.py (old)\n└── search.py (old)\n```\n\n#### Step 2: Implement New Endpoints\n\n**File: `crisis_detection.py`**\n```python\n\"\"\"\nCrisis Detection Routes - Goal #1: PR Crisis Detection & Sentiment Monitoring\n\"\"\"\nfrom fastapi import APIRouter, HTTPException, Query, Depends\nfrom typing import Optional, List\nimport logging\n\nrouter = APIR