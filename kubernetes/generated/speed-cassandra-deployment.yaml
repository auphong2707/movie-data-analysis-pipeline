apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: speed-cassandra
  name: speed-cassandra
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: speed-cassandra
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: speed-cassandra
    spec:
      containers:
        - env:
            - name: CASSANDRA_CLUSTER_NAME
              value: movie-pipeline
            - name: CASSANDRA_DC
              value: datacenter1
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: GossipingPropertyFileSnitch
            - name: CASSANDRA_RACK
              value: rack1
            - name: CASSANDRA_SEEDS
              value: cassandra
            - name: CASSANDRA_START_TIMEOUT
              value: "300"
            - name: HEAP_NEWSIZE
              value: 100M
            - name: JVM_EXTRA_OPTS
              value: -Dcassandra.materialized_views_enabled=true -Dcassandra.user_defined_functions_enabled=true -Dcassandra.enable_user_defined_functions=true -Dcassandra.enable_scripted_user_defined_functions=true
            - name: MAX_HEAP_SIZE
              value: 512M
          image: cassandra:4.1
          livenessProbe:
            exec:
              command:
                - cqlsh
                - -e
                - describe keyspaces
            failureThreshold: 5
            periodSeconds: 30
            timeoutSeconds: 10
          name: speed-cassandra
          ports:
            - containerPort: 9042
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/cassandra
              name: speed-cassandra-data
            - mountPath: /schema.cql
              name: speed-cassandra-cm1
              subPath: schema.cql
      hostname: cassandra
      restartPolicy: Always
      volumes:
        - name: speed-cassandra-data
          persistentVolumeClaim:
            claimName: speed-cassandra-data
        - configMap:
            items:
              - key: reddit_schema.cql
                path: schema.cql
            name: speed-cassandra-cm1
          name: speed-cassandra-cm1
