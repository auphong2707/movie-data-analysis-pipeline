apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: batch-pyspark-runner
  name: batch-pyspark-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: batch-pyspark-runner
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: batch-pyspark-runner
    spec:
      containers:
        - args:
            - sleep
            - infinity
          env:
            - name: PYTHONPATH
              value: /opt/spark-jobs
          envFrom:
            - configMapRef:
                name: env
          image: apache/spark:3.5.4-python3
          name: batch-pyspark-runner
          volumeMounts:
            - mountPath: /opt/spark-jobs
              name: batch-pyspark-runner-cm0
            - mountPath: /opt/.env
              name: batch-pyspark-runner-cm1
              subPath: .env
      hostname: pyspark-runner
      restartPolicy: Always
      volumes:
        - configMap:
            name: batch-pyspark-runner-cm0
          name: batch-pyspark-runner-cm0
        - configMap:
            items:
              - key: .env
                path: .env
            name: batch-pyspark-runner-cm1
          name: batch-pyspark-runner-cm1
