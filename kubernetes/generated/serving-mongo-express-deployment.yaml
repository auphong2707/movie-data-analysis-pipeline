apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: serving-mongo-express
  name: serving-mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: serving-mongo-express
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: serving-mongo-express
    spec:
      containers:
        - env:
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              value: admin
            - name: ME_CONFIG_BASICAUTH_USERNAME
              value: admin
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              value: password
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              value: admin
            - name: ME_CONFIG_MONGODB_URL
              value: mongodb://admin:password@serving-mongodb:27017/
          image: mongo-express:latest
          name: serving-mongo-express
          ports:
            - containerPort: 8081
              protocol: TCP
      restartPolicy: Always
