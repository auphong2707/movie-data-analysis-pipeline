  bronze_ingest.py: "\"\"\"\nBronze Layer - TMDB Metadata Ingestion for Baseline Calculation\n\nFetches TMDB movie metadata and genres for baseline calculation.\nSimplified version - no reviews, no credits (baselines only need metadata).\n\nUsage:\n    spark-submit bronze_ingest.py --pages 100\n\"\"\"\n\nimport argparse\nimport os\nimport sys\nimport time\nfrom datetime import datetime, timedelta\nfrom typing import List, Dict, Any, Optional\nimport requests\nfrom requests.adapters import HTTPAdapter\nfrom urllib3.util.retry import Retry\n\nfrom pyspark.sql import DataFrame\nfrom pyspark.sql.types import (\n    StructType, StructField, StringType, IntegerType, \n    DoubleType, TimestampType, BooleanType\n)\nimport pyspark.sql.functions as F\n\n# Add utils to path\nsys.path.append(os.path.dirname(os.path.abspath(__file__)))\nfrom utils.spark_session import get_spark_session, stop_spark_session\nfrom utils.logger import get_logger, log_execution, JobMetrics\nfrom utils.s3_utils import get_bronze_path\n\nlogger = get_logger(__name__)\n\n\nclass TMDBAPIClient:\n    \"\"\"\n    TMDB API client with rate limiting and retry logic.\n    \n    Features:\n    - Rate limiting (4 requests/second)\n    - Automatic retry with exponential backoff\n    - Request logging\n    \"\"\"\n    \n    def __init__(self, api_key: str, rate_limit: float = 4.0):\n        \"\"\"\n        Initialize TMDB API client.\n        \n        Args:\n            api_key: TMDB API key\n            rate_limit: Max requests per second (default: 4.0)\n        \"\"\"\n        self.api_key = api_key\n        self.base_url = \"https://api.themoviedb.org/3\"\n        self.rate_limit = rate_limit\n        self.min_request_interval = 1.0 / rate_limit\n        self.last_request_time = 0\n        \n        # Setup session with retry strategy\n        self.session = requests.Session()\n        retry_strategy = Retry(\n            total=3,\n            backoff_factor=2,\n            status_forcelist=[429, 500, 502, 503, 504],\n            allowed_methods=[\"GET\"]  # Changed from method_whitelist for urllib3 v2\n        )\n        adapter = HTTPAdapter(max_retries=retry_strategy)\n        self.session.mount(\"https://\", adapter)\n        self.session.mount(\"http://\", adapter)\n    \n    def _rate_limit(self):\n        \"\"\"Enforce rate limiting.\"\"\"\n        current_time = time.time()\n        time_since_last = current_time - self.last_request_time\n        \n        if time_since_last < self.min_request_interval:\n            sleep_time = self.min_request_interval - time_since_last\n            time.sleep(sleep_time)\n        \n        self.last_request_time = time.time()\n    \n    def _make_request(self, endpoint: str, params: Optional[Dict] = None) -> Dict:\n        \"\"\"\n        Make API request with rate limiting.\n        \n        Args:\n            endpoint: API endpoint (e.g., \"movie/popular\")\n            params: Query parameters\n        \n        Returns:\n            JSON response as dictionary\n        \"\"\"\n        self._rate_limit()\n        \n        url = f\"{self.base_url}/{endpoint}\"\n        params = params or {}\n        params['api_key'] = self.api_key\n        \n        try:\n            response = self.session.get(url, params=params, timeout=10)\n            response.raise_for_status()\n            return response.json()\n        except requests.RequestException as e:\n            logger.error(f\"API request failed: {endpoint}\", \n                        extra={\"context\": {\"error\": str(e), \"endpoint\": endpoint}})\n            raise\n    \n    def fetch_genres(self) -> List[Dict]:\n        \"\"\"\n        Fetch list of movie genres from TMDB.\n        \n        Returns:\n            List of genre dictionaries with id and name\n        \"\"\"\n        try:\n            data = self._make_request(\"genre/movie/list\")\n            genres = data.get(\"genres\", [])\n            logger.info(f\"Fetched {len(genres)} genres\")\n            return genres\n        except Exception as e:\n            logger.error(f\"Failed to fetch genres\", \n                        extra={\"context\": {\"error\": str(e)}})\n            return []\n    \n    def fetch_movies(self, category: str = \"popular\", pages: int = None, max_pages: int = 500) -> List[Dict]:\n        \"\"\"\n        Fetch movies from TMDB API.\n        \n        Args:\n            category: Movie category (popular, top_rated, now_playing, upcoming)\n            pages: Number of pages to fetch (20 movies per page). If None, fetch all available pages.\n            max_pages: Maximum pages to fetch as safety limit (default: 500)\n        \n        Returns:\n            List of movie dictionaries\n        \"\"\"\n        movies = []\n        \n        # First request to get total_pages\n        try:\n            first_data = self._make_request(f\"movie/{category}\", params={\"page\": 1})\n            total_available_pages = first_data.get(\"total_pages\", 1)\n            results = first_data.get(\"results\", [])\n            movies.extend(results)\n            \n            # Determine how many pages to fetch\n            if pages is None:\n                # Fetch all pages, but cap at max_pages\n                pages_to_fetch = min(total_available_pages, max_pages)\n            else:\n                pages_to_fetch = min(pages, total_available_pages, max_pages)\n            \n            logger.info(f\"Fetching {pages_to_fetch} pages of {category} movies (total available: {total_available_pages})\")\n            logger.info(f\"Fetched page 1/{pages_to_fetch}: {len(results)} movies\",\n                       extra={\"context\": {\"category\": category, \"page\": 1}})\n            \n            # Fetch remaining pages\n            for page in range(2, pages_to_fetch + 1):\n                try:\n                    data = self._make_request(f\"movie/{category}\", params={\"page\": page})\n                    results = data.get(\"results\", [])\n                    movies.extend(results)\n                    \n                    logger.info(f\"Fetched page {page}/{pages_to_fetch}: {len(results)} movies\",\n                               extra={\"context\": {\"category\": category, \"page\": page}})\n                    \n                except Exception as e:\n                    logger.error(f\"Failed to fetch page {page}\", \n                                extra={\"context\": {\"error\": str(e), \"page\": page}})\n                    continue\n                    \n        except Exception as e:\n            logger.error(f\"Failed to fetch movies for category {category}\", \n                        extra={\"context\": {\"error\": str(e), \"category\": category}})\n        \n        return movies\n    \n    def fetch_movie_details(self, movie_id: int) -> Optional[Dict]:\n        \"\"\"Fetch detailed information for a specific movie.\"\"\"\n        try:\n            return self._make_request(f\"movie/{movie_id}\")\n        except Exception as e:\n            logger.error(f\"Failed to fetch movie details: {movie_id}\",\n                        extra={\"context\": {\"error\": str(e), \"movie_id\": movie_id}})\n            return None\n    \n    def fetch_movie_credits(self, movie_id: int) -> Optional[Dict]:\n        \"\"\"Fetch cast and crew information for a movie.\"\"\"\n        try:\n            return self._make_request(f\"movie/{movie_id}/credits\")\n        except Exception as e:\n            logger.error(f\"Failed to fetch credits: {movie_id}\",\n                        extra={\"context\": {\"error\": str(e), \"movie_id\": movie_id}})\n            return None\n    \n    def fetch_movie_reviews(self, movie_id: int, pages: int = 1) -> List[Dict]:\n        \"\"\"Fetch reviews for a movie.\"\"\"\n        reviews = []\n        \n        for page in range(1, pages + 1):\n            try:\n                data = self._make_request(f\"movie/{movie_id}/reviews\", params={\"page\": page})\n                results = data.get(\"results\", [])\n                reviews.extend(results)\n            except Exception as e:\n                logger.error(f\"Failed to fetch reviews: {movie_id}\",\n                            extra={\"context\": {\"error\": str(e), \"movie_id\": movie_id}})\n                break\n        \n        return reviews\n\n\nclass BronzeIngestionJob:\n    \"\"\"\n    Bronze Layer metadata ingestion job for baseline calculation.\n    \n    Fetches TMDB movie metadata and genres only (no reviews, no credits).\n    \"\"\"\n    \n    def __init__(self, spark, api_key: str):\n        self.spark = spark\n        self.api_client = TMDBAPIClient(api_key)\n        self.metrics = JobMetrics(\"bronze_ingest\")\n    \n    @log_execution(logger, \"bronze_ingest\")\n    def run(\n        self,\n        categories: List[str] = None,\n        pages_per_category: int = 100,\n        max_pages: int = 500\n    ):\n        \"\"\"\n        Run Bronze layer metadata ingestion.\n        \n        Args:\n            categories: Movie categories to extract (default: [\"popular\", \"top_rated\"])\n            pages_per_category: Number of pages to fetch per category (default: 100 = ~2000 movies)\n            max_pages: Maximum pages to fetch as safety limit (default: 500)\n        \"\"\"\n        if categories is None:\n            categories = [\"popular\", \"top_rated\"]\n        \n        extraction_time = datetime.utcnow()\n        \n        logger.info(\"Starting Bronze layer metadata ingestion for baselines\",\n                   extra={\"context\": {\n                       \"extraction_time\": extraction_time.isoformat() + \"Z\",\n                       \"categories\": categories,\n                       \"pages_per_category\": pages_per_category if pages_per_category else \"all\",\n                       \"max_pages\": max_pages\n                   }})\n        \n        # Fetch genres first\n        genres = self.api_client.fetch_genres()\n        self._write_genres_to_bronze(genres, extraction_time)\n        \n        # Fetch movies from each category\n        all_movies = []\n        for category in categories:\n            movies = self.api_client.fetch_movies(category, pages_per_category, max_pages)\n            all_movies.extend(movies)\n            self.metrics.add_metric(f\"movies_fetched_{category}\", len(movies))\n        \n        # Deduplicate by movie_id (across categories)\n        unique_movies = {m['id']: m for m in all_movies}.values()\n        unique_movies = list(unique_movies)\n        \n        logger.info(f\"Fetched {len(all_movies)} total movies, {len(unique_movies)} unique\")\n        self.metrics.add_metric(\"total_movies_fetched\", len(all_movies))\n        self.metrics.add_metric(\"unique_movies\", len(unique_movies))\n        \n        # Enrich movies with detailed metadata (budget, runtime, belongs_to_collection, director)\n        enriched_movies = self._enrich_movies_with_details(unique_movies)\n        \n        # Write movies to Bronze\n        self._write_movies_to_bronze(enriched_movies, extraction_time)\n        \n        # Fetch reviews for baseline sentiment calculation (top 50 movies only)\n        movie_ids = [m['id'] for m in enriched_movies[:50]]\n        reviews = self._fetch_reviews_batch(movie_ids)\n        self._write_reviews_to_bronze(reviews, extraction_time)\n        \n        # Log final metrics\n        self.metrics.log(logger)\n        \n        logger.info(\"Bronze layer metadata ingestion completed successfully\")\n    \n    def _enrich_movies_with_details(self, movies: List[Dict]) -> List[Dict]:\n        \"\"\"\n        Enrich basic movie data with detailed metadata.\n        \n        Fetches for each movie:\n        - /movie/{id} endpoint: budget, runtime, belongs_to_collection\n        - /movie/{id}/credits endpoint: director\n        \n        Implements rate limiting to respect TMDB API limits (40 requests/10 seconds).\n        \"\"\"\n        import time\n        \n        total_movies = len(movies)\n        enriched = []\n        request_count = 0\n        start_time = time.time()\n        \n        logger.info(f\"Enriching {total_movies} movies with detailed metadata\")\n        logger.info(\"This will take ~30 minutes due to API rate limiting\")\n        \n        for idx, movie in enumerate(movies, 1):\n            movie_id = movie['id']\n            \n            try:\n                # Fetch detailed metadata\n                details = self.api_client.fetch_movie_details(movie_id)\n                request_count += 1\n                \n                if details:\n                    # Add budget, runtime, belongs_to_collection\n                    movie['budget'] = details.get('budget', 0)\n                    movie['runtime'] = details.get('runtime')\n                    # Extract franchise name from belongs_to_collection object\n                    collection = details.get('belongs_to_collection')\n                    movie['belongs_to_collection'] = collection.get('name') if collection else None\n                else:\n                    movie['budget'] = 0\n                    movie['runtime'] = None\n                    movie['belongs_to_collection'] = None\n                \n                # Fetch credits for director\n                credits = self.api_client.fetch_movie_credits(movie_id)\n                request_count += 1\n                \n                if credits:\n                    # Extract director from crew\n                    crew = credits.get('crew', [])\n                    directors = [c['name'] for c in crew if c.get('job') == 'Director']\n                    movie['director'] = directors[0] if directors else None\n                else:\n                    movie['director'] = None\n                \n                enriched.append(movie)\n                \n                # Rate limiting: max 40 requests per 10 seconds = 4 req/sec\n                if request_count % 40 == 0:\n                    elapsed = time.time() - start_time\n                    if elapsed < 10:\n                        sleep_time = 10 - elapsed\n                        logger.info(f\"Rate limit: sleeping {sleep_time:.1f}s (processed {idx}/{total_movies})\")\n                        time.sleep(sleep_time)\n                    start_time = time.time()\n                \n                # Progress logging every 100 movies\n                if idx % 100 == 0:\n                    logger.info(f\"Enriched {idx}/{total_movies} movies ({idx/total_movies*100:.1f}%)\")\n                \n            except Exception as e:\n                logger.error(f\"Failed to enrich movie {movie_id}: {str(e)}\")\n                # Keep original movie without enrichment\n                movie['budget'] = 0\n                movie['runtime'] = None\n                movie['belongs_to_collection'] = None\n                movie['director'] = None\n                enriched.append(movie)\n        \n        enriched_count = sum(1 for m in enriched if m.get('budget') or m.get('runtime'))\n        logger.info(f\"Successfully enriched {enriched_count}/{total_movies} movies with detailed data\")\n        self.metrics.add_metric(\"movies_enriched\", enriched_count)\n        \n        return enriched\n    \n    def _fetch_reviews_batch(self, movie_ids: List[int]) -> List[Dict]:\n        \"\"\"Fetch reviews for multiple movies for baseline sentiment calculation.\"\"\"\n        logger.info(f\"Fetching reviews for {len(movie_ids)} movies for baseline calculation\")\n        all_reviews = []\n        \n        for movie_id in movie_ids:\n            reviews = self.api_client.fetch_movie_reviews(movie_id, pages=1)\n            for review in reviews:\n                review['movie_id'] = movie_id\n            all_reviews.extend(reviews)\n        \n        self.metrics.add_metric(\"reviews_fetched\", len(all_reviews))\n        return all_reviews\n    \n    def _write_genres_to_bronze(self, genres: List[Dict], extraction_time: datetime):\n        \"\"\"Write genres to Bronze layer.\"\"\"\n        if not genres:\n            logger.warning(\"No genres to write to Bronze\")\n            return\n        \n        logger.info(f\"Writing {len(genres)} genres to Bronze layer\")\n        \n        # Add extraction metadata\n        for genre in genres:\n            genre['extraction_timestamp'] = extraction_time.isoformat() + \"Z\"\n        \n        # Create DataFrame\n        df = self.spark.createDataFrame(genres)\n        \n        # Write to S3A (overwrite mode for genres since they're static)\n        output_path = get_bronze_path(\"tmdb_genres\", None).rstrip('/')\n        \n        df.write \\\n            .mode(\"overwrite\") \\\n            .parquet(output_path)\n        \n        logger.info(f\"Wrote {len(genres)} genres to {output_path}\")\n        self.metrics.add_metric(\"genres_written\", len(genres))\n    \n    def _write_movies_to_bronze(self, movies: List[Dict], extraction_time: datetime):\n        \"\"\"Write movies to Bronze layer.\"\"\"\n        if not movies:\n            logger.warning(\"No movies to write to Bronze\")\n            return\n        \n        logger.info(f\"Writing {len(movies)} movies to Bronze layer\")\n        \n        # Add extraction metadata\n        for movie in movies:\n            movie['extraction_timestamp'] = extraction_time.isoformat() + \"Z\"\n        \n        # Define explicit schema to handle None values\n        from pyspark.sql.types import (\n            StructType, StructField, StringType, IntegerType, \n            DoubleType, BooleanType, ArrayType\n        )\n        \n        schema = StructType([\n            StructField(\"id\", IntegerType(), False),\n            StructField(\"title\", StringType(), True),\n            StructField(\"original_title\", StringType(), True),\n            StructField(\"overview\", StringType(), True),\n            StructField(\"release_date\", StringType(), True),\n            StructField(\"genre_ids\", ArrayType(IntegerType()), True),\n            StructField(\"popularity\", DoubleType(), True),\n            StructField(\"vote_average\", DoubleType(), True),\n            StructField(\"vote_count\", IntegerType(), True),\n            StructField(\"adult\", BooleanType(), True),\n            StructField(\"video\", BooleanType(), True),\n            StructField(\"poster_path\", StringType(), True),\n            StructField(\"backdrop_path\", StringType(), True),\n            StructField(\"original_language\", StringType(), True),\n            # Enriched fields (will be None when enrichment is disabled)\n            StructField(\"budget\", IntegerType(), True),\n            StructField(\"runtime\", IntegerType(), True),\n            StructField(\"belongs_to_collection\", StringType(), True),  # Franchise name\n            StructField(\"director\", StringType(), True),\n            # Extraction metadata\n            StructField(\"extraction_timestamp\", StringType(), False),\n        ])\n        \n        # Create DataFrame with explicit schema\n        df = self.spark.createDataFrame(movies, schema=schema)\n        \n        # Write to S3A (overwrite mode for movies baseline dataset)\n        output_path = get_bronze_path(\"tmdb_movies\", None).rstrip('/')\n        \n        df.write \\\n            .mode(\"overwrite\") \\\n            .parquet(output_path)\n        \n        logger.info(f\"Wrote {len(movies)} movies to {output_path}\")\n        self.metrics.add_metric(\"movies_written\", len(movies))\n    \n    def _write_reviews_to_bronze(self, reviews: List[Dict], extraction_time: datetime):\n        \"\"\"Write reviews to Bronze layer for baseline calculation.\"\"\"\n        if not reviews:\n            logger.warning(\"No reviews to write to Bronze\")\n            return\n        \n        logger.info(f\"Writing {len(reviews)} reviews to Bronze layer\")\n        \n        for review in reviews:\n            review['extraction_timestamp'] = extraction_time.isoformat() + \"Z\"\n        \n        df = self.spark.createDataFrame(reviews)\n        output_path = get_bronze_path(\"tmdb_reviews\", None).rstrip('/')\n        \n        df.write \\\n            .mode(\"overwrite\") \\\n            .parquet(output_path)\n        \n        logger.info(f\"Wrote {len(reviews)} reviews to {output_path}\")\n        self.metrics.add_metric(\"reviews_written\", len(reviews))\n\n\ndef main():\n    \"\"\"Main entry point for Bronze metadata ingestion job.\"\"\"\n    parser = argparse.ArgumentParser(description=\"Bronze Layer TMDB Metadata Ingestion for Baselines\")\n    parser.add_argument(\"--categories\", type=str, default=\"popular,top_rated\",\n                       help=\"Comma-separated list of movie categories\")\n    parser.add_argument(\"--pages-per-category\", type=int, default=100,\n                       help=\"Number of pages to fetch per category (default: 100 = ~2000 movies)\")\n    parser.add_argument(\"--max-pages\", type=int, default=500,\n                       help=\"Maximum pages to fetch as safety limit (default: 500)\")\n    \n    args = parser.parse_args()\n    \n    # Get API key from environment\n    api_key = os.getenv('TMDB_API_KEY')\n    if not api_key:\n        logger.error(\"TMDB_API_KEY environment variable not set\")\n        sys.exit(1)\n    \n    categories = [c.strip() for c in args.categories.split(',')]\n    \n    spark = None\n    try:\n        # Create Spark session\n        spark = get_spark_session(\"bronze_ingest\")\n        \n        # Run ingestion\n        job = BronzeIngestionJob(spark, api_key)\n        job.run(\n            categories=categories,\n            pages_per_category=args.pages_per_category,\n            max_pages=args.max_pages\n        )\n        \n    except Exception as e:\n        logger.error(f\"Bronze metadata ingestion failed: {str(e)}\", exc_info=True)\n        sys.exit(1)\n    \n    finally:\n        if spark:\n            stop_spark_session(spark)\n\n\nif __name__ == \"__main__\":\n    main()\n"
  export_to_mongo.py: "\"\"\"\nExport Gold Layer to 3 Separate MongoDB Collections\n\nReads three separate Gold layer datasets and exports to 3 MongoDB collections:\n1. sentiment_baselines: Genre/franchise/yearly sentiment patterns (Business Goal #1: PR Crisis Detection)\n2. viral_thresholds: Genre/budget-tier/seasonal viral cutoffs (Business Goal #2: Viral Content Detection)\n3. movie_intelligence: Individual movie competitive data (Business Goal #3: Content Recommendation)\n\nEach collection maintains its own clean schema without null pollution from other view types.\n\nUsage:\n    python export_to_mongo.py\n\"\"\"\n\nimport argparse\nimport os\nimport sys\nfrom datetime import datetime\nfrom typing import List, Dict, Any\n\nfrom pymongo import MongoClient, UpdateOne, ReplaceOne, ASCENDING, DESCENDING\nfrom pymongo.errors import BulkWriteError\n\n# Add utils to path\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\nfrom utils.spark_session import get_spark_session, stop_spark_session\nfrom utils.logger import get_logger, log_execution, JobMetrics\nfrom utils.s3_utils import get_gold_path\n\nlogger = get_logger(__name__)\n\n\nclass MongoDBExporter:\n    \"\"\"\n    Export Gold layer to 3 separate MongoDB collections.\n    \n    Features:\n    - 3 separate collections: sentiment_baselines, viral_thresholds, movie_intelligence\n    - Custom indexes per collection (no view_type field needed)\n    - Bulk upsert operations with collection-specific filter keys\n    - Error handling and retry\n    \"\"\"\n    \n    # Configuration for 3 separate collections\n    COLLECTIONS_CONFIG = {\n        \"sentiment_baselines\": {\n            \"indexes\": [\n                ([(\"genre\", 1)], {}),\n                ([(\"franchise\", 1)], {}),\n                ([(\"year\", 1)], {}),\n                ([(\"genre\", 1), (\"year\", 1)], {}),\n                ([(\"franchise\", 1), (\"year\", 1)], {}),\n                ([(\"batch_run_timestamp\", -1)], {}),\n            ],\n            \"filter_keys\": [\"genre\", \"franchise\", \"year\"]\n        },\n        \"viral_thresholds\": {\n            \"indexes\": [\n                ([(\"genre\", 1)], {}),\n                ([(\"budget_tier\", 1)], {}),\n                ([(\"season\", 1)], {}),\n                ([(\"genre\", 1), (\"budget_tier\", 1), (\"season\", 1)], {}),\n                ([(\"batch_run_timestamp\", -1)], {}),\n            ],\n            \"filter_keys\": [\"genre\", \"budget_tier\", \"season\"]\n        },\n        \"movie_intelligence\": {\n            \"indexes\": [\n                ([(\"movie_id\", 1)], {\"unique\": True}),\n                ([(\"genre\", 1)], {}),\n                ([(\"release_year\", 1)], {}),\n                ([(\"franchise\", 1)], {}),\n                ([(\"genre\", 1), (\"release_year\", 1)], {}),\n                ([(\"budget_tier\", 1)], {}),\n                ([(\"batch_run_timestamp\", -1)], {}),\n            ],\n            \"filter_keys\": [\"movie_id\"]\n        }\n    }\n    \n    DATASETS = [\"sentiment_baselines\", \"viral_thresholds\", \"movie_intelligence\"]\n    \n    def __init__(self, connection_string: str, database: str = \"moviedb\"):\n        \"\"\"\n        Initialize MongoDB exporter.\n        \n        Args:\n            connection_string: MongoDB connection string\n            database: Database name (default: moviedb)\n        \"\"\"\n        self.client = MongoClient(connection_string)\n        self.db = self.client[database]\n        self.metrics = JobMetrics(\"mongo_export\")\n        \n        logger.info(f\"Connected to MongoDB: {database}\")\n    \n    def close(self):\n        \"\"\"Close MongoDB connection.\"\"\"\n        if self.client:\n            self.client.close()\n            logger.info(\"Closed MongoDB connection\")\n    \n    def create_indexes(self, collection_name: str):\n        \"\"\"Create indexes on a specific collection.\"\"\"\n        collection = self.db[collection_name]\n        \n        logger.info(f\"Creating indexes on {collection_name} collection\")\n        \n        config = self.COLLECTIONS_CONFIG.get(collection_name)\n        if not config:\n            logger.warning(f\"No configuration found for collection: {collection_name}\")\n            return\n        \n        indexes = config[\"indexes\"]\n        \n        for keys, options in indexes:\n            try:\n                collection.create_index(keys, **options)\n                logger.info(f\"Created index on {collection_name}: {keys}\")\n            except Exception as e:\n                logger.warning(f\"Failed to create index {keys} on {collection_name}: {str(e)}\")\n        \n        self.metrics.add_metric(f\"{collection_name}_indexes_created\", len(indexes))\n    \n    def _row_to_dict(self, row):\n        \"\"\"\n        Recursively convert Row to dictionary, preserving nested structures.\n        \"\"\"\n        if row is None:\n            return None\n        \n        result = {}\n        for key in row.__fields__:\n            value = getattr(row, key)\n            \n            # Handle nested Row (struct)\n            if hasattr(value, '__fields__'):\n                result[key] = self._row_to_dict(value)\n            # Handle list of Rows\n            elif isinstance(value, list) and len(value) > 0 and hasattr(value[0], '__fields__'):\n                result[key] = [self._row_to_dict(item) for item in value]\n            # Handle regular values\n            else:\n                result[key] = value\n        \n        return result\n    \n    def export_collection(\n        self,\n        df,\n        collection_name: str,\n        batch_size: int = 1000\n    ) -> int:\n        \"\"\"\n        Export DataFrame to a specific MongoDB collection.\n        \n        Args:\n            df: Spark DataFrame with collection data\n            collection_name: Name of the MongoDB collection\n            batch_size: Batch size for bulk writes\n        \n        Returns:\n            Number of documents exported\n        \"\"\"\n        logger.info(f\"Exporting to MongoDB collection: {collection_name}\")\n        \n        # Convert DataFrame to list of dictionaries (preserving nested structures)\n        records = df.collect()\n        documents = [self._row_to_dict(row) for row in records]\n        \n        total_count = len(documents)\n        logger.info(f\"Prepared {total_count} documents for {collection_name}\")\n        \n        # Get collection config\n        config = self.COLLECTIONS_CONFIG.get(collection_name)\n        if not config:\n            logger.error(f\"No configuration found for collection: {collection_name}\")\n            return 0\n        \n        filter_keys = config[\"filter_keys\"]\n        \n        # Bulk upsert in batches\n        collection = self.db[collection_name]\n        exported_count = 0\n        \n        for i in range(0, total_count, batch_size):\n            batch = documents[i:i + batch_size]\n            \n            # Create bulk operations\n            operations = []\n            for doc in batch:\n                # Build filter from configured keys (skip None values)\n                filter_doc = {\n                    key: doc.get(key)\n                    for key in filter_keys\n                    if doc.get(key) is not None\n                }\n                \n                operations.append(\n                    ReplaceOne(\n                        filter_doc,\n                        doc,\n                        upsert=True\n                    )\n                )\n            \n            # Execute bulk write\n            try:\n                result = collection.bulk_write(operations, ordered=False)\n                exported_count += result.upserted_count + result.modified_count\n                \n                logger.info(\n                    f\"batch_views batch {i // batch_size + 1}: \"\n                    f\"upserted={result.upserted_count}, modified={result.modified_count}\"\n                )\n                \n            except BulkWriteError as bwe:\n                # Log errors but continue\n                logger.error(f\"Bulk write error in {collection_name}: {bwe.details}\", exc_info=True)\n                # Count successful operations\n                exported_count += len(batch) - len(bwe.details.get('writeErrors', []))\n        \n        logger.info(f\"Exported {exported_count}/{total_count} documents to {collection_name}\")\n        self.metrics.add_metric(f\"{collection_name}_exported\", exported_count)\n        \n        return exported_count\n\n\nclass MongoExportJob:\n    \"\"\"\n    Job to export 3 separate collections from Gold layer to MongoDB.\n    \n    Exports 3 collections for 3 business goals:\n    1. sentiment_baselines: For PR Crisis Detection (Business Goal #1)\n    2. viral_thresholds: For Viral Content Detection (Business Goal #2)\n    3. movie_intelligence: For Content Recommendation (Business Goal #3)\n    \"\"\"\n    \n    def __init__(self, spark, mongo_exporter: MongoDBExporter):\n        self.spark = spark\n        self.mongo_exporter = mongo_exporter\n    \n    @log_execution(logger, \"mongo_export\")\n    def run(self):\n        \"\"\"\n        Run MongoDB export for all 3 collections.\n        \"\"\"\n        logger.info(\"Starting MongoDB 3-collection export (for 3 business goals)\")\n        \n        # Export each collection separately\n        for collection_name in self.mongo_exporter.DATASETS:\n            try:\n                # Create indexes\n                self.mongo_exporter.create_indexes(collection_name)\n                \n                # Export data\n                self._export_collection(collection_name)\n                \n            except Exception as e:\n                logger.error(f\"Failed to export {collection_name}: {str(e)}\", exc_info=True)\n                # Continue with next collection\n        \n        # Log final metrics\n        self.mongo_exporter.metrics.log(logger)\n        logger.info(\"MongoDB 3-collection export completed\")\n    \n    def _export_collection(self, collection_name: str):\n        \"\"\"Export a single collection from Gold to MongoDB.\"\"\"\n        logger.info(f\"Exporting {collection_name}\")\n        \n        # Read from Gold layer (separate path for each collection)\n        gold_path = get_gold_path(collection_name, None).rstrip('/')\n        \n        try:\n            df = self.spark.read.parquet(gold_path)\n            count = df.count()\n            \n            if count == 0:\n                logger.warning(f\"No data found in Gold layer for {collection_name}\")\n                return\n            \n            logger.info(f\"Read {count} records from {gold_path}\")\n            \n            # Export to MongoDB\n            exported = self.mongo_exporter.export_collection(df, collection_name)\n            \n            logger.info(f\"Successfully exported {exported} records to {collection_name}\")\n            \n        except Exception as e:\n            logger.error(f\"Failed to export {collection_name}: {str(e)}\", exc_info=True)\n            raise\n\n\ndef main():\n    \"\"\"Main entry point for MongoDB 3-collection export job.\"\"\"\n    parser = argparse.ArgumentParser(description=\"Export Gold Layer to 3 MongoDB Collections (3 Business Goals)\")\n    parser.add_argument(\"--mongo-uri\", type=str,\n                       default=None,\n                       help=\"MongoDB connection string (default: from env)\")\n    parser.add_argument(\"--database\", type=str, default=\"moviedb\",\n                       help=\"MongoDB database name (default: moviedb)\")\n    \n    args = parser.parse_args()\n    \n    # Get MongoDB connection from args or environment\n    mongo_uri = args.mongo_uri or os.getenv('MONGODB_CONNECTION_STRING')\n    if not mongo_uri:\n        logger.error(\"MongoDB connection string not provided\")\n        sys.exit(1)\n    \n    spark = None\n    mongo_exporter = None\n    \n    try:\n        # Create Spark session\n        spark = get_spark_session(\"mongo_export\")\n        \n        # Create MongoDB exporter\n        mongo_exporter = MongoDBExporter(mongo_uri, args.database)\n        \n        # Run export\n        job = MongoExportJob(spark, mongo_exporter)\n        job.run()\n        \n    except Exception as e:\n        logger.error(f\"MongoDB multi-goal export failed: {str(e)}\", exc_info=True)\n        sys.exit(1)\n    \n    finally:\n        if mongo_exporter:\n            mongo_exporter.close()\n        if spark:\n            stop_spark_session(spark)\n\n\nif __name__ == \"__main__\":\n    main()\n"
  gold_aggregate.py: "\"\"\"\nGold Layer - Separate Views Export for 3 Business Goals\n\nReads three datasets from Silver layer and exports them as SEPARATE collections:\n1. sentiment_baselines: Genre/franchise/yearly sentiment patterns (Business Goal #1: PR Crisis Detection)\n2. viral_thresholds: Genre/budget-tier/seasonal viral cutoffs (Business Goal #2: Viral Content Detection)\n3. movie_intelligence: Individual movie competitive data (Business Goal #3: Content Recommendation)\n\nEach dataset is kept SEPARATE to avoid schema pollution and maintain clear business logic separation.\n\nUsage:\n    spark-submit gold_aggregate.py\n\"\"\"\n\nimport argparse\nimport os\nimport sys\nfrom datetime import datetime, timedelta\nfrom typing import Optional\n\nfrom pyspark.sql import DataFrame, Window\nfrom pyspark.sql.types import StringType, IntegerType, DoubleType, DateType\nimport pyspark.sql.functions as F\n\n# Add utils to path\nsys.path.append(os.path.dirname(os.path.abspath(__file__)))\nfrom utils.spark_session import get_spark_session, stop_spark_session\nfrom utils.logger import get_logger, log_execution, JobMetrics\nfrom utils.s3_utils import get_silver_path, get_gold_path\n\nlogger = get_logger(__name__)\n\n\nclass GoldAggregationJob:\n    \"\"\"\n    Gold Layer separate views export job.\n    \n    Reads three datasets from Silver and exports them as SEPARATE Gold datasets:\n    1. sentiment_baselines: For PR Crisis Detection (Business Goal #1)\n    2. viral_thresholds: For Viral Content Detection (Business Goal #2)\n    3. movie_intelligence: For Content Recommendation (Business Goal #3)\n    \n    Each dataset is kept separate to avoid schema pollution with null fields.\n    \"\"\"\n    \n    DATASETS = [\n        \"sentiment_baselines\",\n        \"viral_thresholds\",\n        \"movie_intelligence\"\n    ]\n    \n    def __init__(self, spark):\n        self.spark = spark\n        self.metrics = JobMetrics(\"gold_separate_views\")\n        self.batch_timestamp = datetime.utcnow()\n    \n    @log_execution(logger, \"gold_separate_views\")\n    def run(self):\n        \"\"\"\n        Load all three datasets from Silver, add metadata,\n        and write them as SEPARATE Gold datasets (no merging).\n        \"\"\"\n        logger.info(\"Starting Gold layer separate views export\")\n        \n        # Process each dataset separately\n        for dataset_name in self.DATASETS:\n            try:\n                logger.info(f\"Processing dataset: {dataset_name}\")\n                \n                # Load from Silver\n                df = self._load_from_silver(dataset_name)\n                \n                if df is None:\n                    logger.warning(f\"No data found in Silver for {dataset_name}\")\n                    continue\n                \n                # Add temporal metadata (but NOT view_type - we keep them separate)\n                df = self._add_metadata(df, dataset_name)\n                \n                # Write to separate Gold path\n                self._write_to_gold(df, dataset_name)\n                \n            except Exception as e:\n                logger.error(f\"Failed to process {dataset_name}: {str(e)}\", exc_info=True)\n                # Continue with next dataset\n        \n        # Log metrics\n        self.metrics.log(logger)\n        logger.info(\"Gold layer separate views export completed\")\n    \n    def _load_from_silver(self, dataset_name: str) -> Optional[DataFrame]:\n        \"\"\"Load dataset from Silver layer.\"\"\"\n        try:\n            silver_path = get_silver_path(dataset_name, None).rstrip('/')\n            logger.info(f\"Loading {dataset_name} from Silver: {silver_path}\")\n            \n            df = self.spark.read.parquet(silver_path)\n            \n            count = df.count()\n            logger.info(f\"Loaded {count} records from Silver/{dataset_name}\")\n            self.metrics.add_metric(f\"{dataset_name}_loaded\", count)\n            \n            return df if count > 0 else None\n            \n        except Exception as e:\n            logger.error(f\"Failed to load Silver/{dataset_name}: {str(e)}\", exc_info=True)\n            return None\n    \n    def _add_metadata(self, df: DataFrame, dataset_name: str) -> DataFrame:\n        \"\"\"\n        Add temporal metadata only (NO view_type discriminator - keep datasets separate).\n        \n        Metadata fields:\n        - batch_run_timestamp: When this batch was calculated (ISO 8601 UTC)\n        - aggregation_granularity: 'all_time' (current), or 'daily'/'weekly'/'monthly' (future)\n        - data_period_start: Start of data period (for all_time: earliest movie date)\n        - data_period_end: End of data period (for all_time: latest movie date)\n        \n        These fields enable future daily/weekly aggregations without schema changes.\n        \"\"\"\n        # Handle genre field type if it's an array\n        if \"genre\" in df.columns:\n            from pyspark.sql.types import ArrayType\n            genre_type = [f.dataType for f in df.schema.fields if f.name == \"genre\"][0]\n            if isinstance(genre_type, ArrayType):\n                logger.info(f\"Converting genre from ARRAY<STRING> to STRING in {dataset_name}\")\n                df = df.withColumn(\"genre\", F.concat_ws(\", \", F.col(\"genre\")))\n        \n        # Add batch processing metadata\n        df = df.withColumn(\"batch_run_timestamp\", F.lit(self.batch_timestamp.isoformat() + \"Z\"))\n        df = df.withColumn(\"aggregation_granularity\", F.lit(\"all_time\"))\n        \n        # For all_time aggregations, use placeholder dates\n        df = df.withColumn(\"data_period_start\", F.lit(\"1900-01-01\").cast(StringType()))\n        df = df.withColumn(\"data_period_end\", F.lit(datetime.utcnow().strftime(\"%Y-%m-%d\")).cast(StringType()))\n        \n        logger.info(f\"Added metadata to {dataset_name}\")\n        \n        return df\n    \n    def _write_to_gold(self, df: DataFrame, dataset_name: str):\n        \"\"\"Write dataset to SEPARATE Gold layer path (no merging).\"\"\"\n        try:\n            output_path = get_gold_path(dataset_name, None).rstrip('/')\n            \n            logger.info(f\"Writing {dataset_name} to Gold layer: {output_path}\")\n            \n            df.write \\\n                .mode(\"overwrite\") \\\n                .parquet(output_path)\n            \n            count = df.count()\n            logger.info(f\"Successfully wrote {count} records to Gold/{dataset_name}\")\n            self.metrics.add_metric(f\"{dataset_name}_written\", count)\n            \n        except Exception as e:\n            logger.error(f\"Failed to write Gold/{dataset_name}: {str(e)}\", exc_info=True)\n            raise\n\n\ndef main():\n    \"\"\"Main entry point for Gold separate views export job.\"\"\"\n    parser = argparse.ArgumentParser(description=\"Gold Layer Separate Views Export (3 Collections)\")\n    \n    args = parser.parse_args()\n    \n    spark = None\n    try:\n        # Create Spark session\n        spark = get_spark_session(\"gold_separate_views\")\n        \n        # Run export\n        job = GoldAggregationJob(spark)\n        job.run()\n        \n    except Exception as e:\n        logger.error(f\"Gold separate views export failed: {str(e)}\", exc_info=True)\n        sys.exit(1)\n    \n    finally:\n        if spark:\n            stop_spark_session(spark)\n\n\nif __name__ == \"__main__\":\n    main()\n"
  silver_transform.py: "\"\"\"\nSilver Layer - Multi-Goal Baseline Calculation\n\nGenerates three optimized datasets for business goals:\n1. Sentiment Baselines: Genre/franchise/director/temporal sentiment patterns\n2. Viral Thresholds: Genre/budget-tier/seasonal viral cutoffs  \n3. Movie Intelligence: Individual movie data for competitive analysis\n\nUsage:\n    spark-submit silver_transform.py\n\"\"\"\n\nimport argparse\nimport os\nimport sys\nfrom datetime import datetime, timedelta\nfrom typing import List, Dict, Optional\n\nfrom pyspark.sql import DataFrame, Window\nfrom pyspark.sql.types import (\n    StructType, StructField, StringType, IntegerType,\n    DoubleType, TimestampType, ArrayType, DateType\n)\nimport pyspark.sql.functions as F\n\n# Add utils to path\nsys.path.append(os.path.dirname(os.path.abspath(__file__)))\nfrom utils.spark_session import get_spark_session, stop_spark_session\nfrom utils.logger import get_logger, log_execution, JobMetrics\nfrom utils.s3_utils import get_bronze_path, get_silver_path\n\nlogger = get_logger(__name__)\n\n\nclass SentimentAnalyzer:\n    \"\"\"\n    Simple sentiment analyzer using VADER-like approach.\n    \n    For production, consider using:\n    - VADER (vaderSentiment library)\n    - Transformer models (BERT, RoBERTa)\n    - Cloud APIs (AWS Comprehend, Google NLP)\n    \"\"\"\n    \n    # Simple sentiment word lists\n    POSITIVE_WORDS = {\n        'excellent', 'amazing', 'great', 'wonderful', 'fantastic', 'perfect',\n        'love', 'loved', 'best', 'brilliant', 'outstanding', 'superb',\n        'masterpiece', 'incredible', 'awesome', 'beautiful', 'good'\n    }\n    \n    NEGATIVE_WORDS = {\n        'terrible', 'awful', 'bad', 'worst', 'horrible', 'poor',\n        'boring', 'waste', 'disappointing', 'disappointed', 'dull',\n        'weak', 'fail', 'failed', 'hate', 'hated', 'trash'\n    }\n    \n    @classmethod\n    def analyze_text(cls, text: str) -> Dict[str, float]:\n        \"\"\"\n        Analyze sentiment of text.\n        \n        Returns:\n            Dictionary with score (-1 to 1) and label\n        \"\"\"\n        if not text:\n            return {'score': 0.0, 'label': 'neutral'}\n        \n        text_lower = text.lower()\n        words = text_lower.split()\n        \n        positive_count = sum(1 for word in words if word in cls.POSITIVE_WORDS)\n        negative_count = sum(1 for word in words if word in cls.NEGATIVE_WORDS)\n        \n        total_sentiment_words = positive_count + negative_count\n        \n        if total_sentiment_words == 0:\n            score = 0.0\n            label = 'neutral'\n        else:\n            score = (positive_count - negative_count) / len(words)\n            # Normalize to -1 to 1 range\n            score = max(-1.0, min(1.0, score * 10))\n            \n            if score > 0.2:\n                label = 'positive'\n            elif score < -0.2:\n                label = 'negative'\n            else:\n                label = 'neutral'\n        \n        return {'score': score, 'label': label}\n\n\n# Register sentiment analysis as UDF\ndef sentiment_score_udf(text):\n    \"\"\"UDF for sentiment score.\"\"\"\n    result = SentimentAnalyzer.analyze_text(text)\n    return result['score']\n\ndef sentiment_label_udf(text):\n    \"\"\"UDF for sentiment label.\"\"\"\n    result = SentimentAnalyzer.analyze_text(text)\n    return result['label']\n\n\nclass BaselineCalculationJob:\n    \"\"\"\n    Multi-Goal Baseline Calculation Job for Silver Layer.\n    \n    Generates three optimized datasets:\n    1. Sentiment Baselines: Genre/franchise/director/temporal patterns\n    2. Viral Thresholds: Genre/budget-tier/seasonal cutoffs\n    3. Movie Intelligence: Individual movie data for competitive analysis\n    \n    Processes:\n    1. Load TMDB movies, reviews, genres from Bronze\n    2. Enrich with franchise, director, budget tier classification\n    3. Calculate three separate datasets optimized per business goal\n    4. Write to three separate Parquet files in Silver layer\n    \"\"\"\n    \n    # Budget tier thresholds (in USD)\n    BUDGET_TIERS = {\n        'indie': (0, 20_000_000),\n        'mid': (20_000_000, 100_000_000),\n        'blockbuster': (100_000_000, float('inf'))\n    }\n    \n    def __init__(self, spark):\n        self.spark = spark\n        self.metrics = JobMetrics(\"multi_goal_baseline_calculation\")\n        \n        # Register UDFs\n        self.spark.udf.register(\"sentiment_score\", sentiment_score_udf, DoubleType())\n        self.spark.udf.register(\"sentiment_label\", sentiment_label_udf, StringType())\n    \n    @log_execution(logger, \"multi_goal_baseline_calculation\")\n    def run(self):\n        \"\"\"\n        Run multi-goal baseline calculation.\n        \n        Generates three datasets:\n        1. sentiment_baselines: Genre/franchise/director/temporal sentiment patterns\n        2. viral_thresholds: Genre/budget-tier/seasonal viral cutoffs\n        3. movie_intelligence: Individual movie competitive data\n        \"\"\"\n        logger.info(\"Starting multi-goal baseline calculation from TMDB data\")\n        \n        # Load Bronze data\n        movies_df = self._load_bronze_movies()\n        reviews_df = self._load_bronze_reviews()\n        genres_df = self._load_bronze_genres()\n        \n        if movies_df is None or genres_df is None:\n            logger.error(\"Cannot calculate baselines without movies and genres\")\n            return\n        \n        # Enrich movies with derived fields\n        enriched_movies_df = self._enrich_movies(movies_df, reviews_df, genres_df)\n        \n        if enriched_movies_df is None:\n            logger.error(\"Movie enrichment failed\")\n            return\n        \n        # Generate three datasets\n        sentiment_baselines_df = self._generate_sentiment_baselines(enriched_movies_df)\n        viral_thresholds_df = self._generate_viral_thresholds(enriched_movies_df)\n        movie_intelligence_df = self._generate_movie_intelligence(enriched_movies_df)\n        \n        # Write to Silver layer\n        if sentiment_baselines_df:\n            self._write_to_silver(sentiment_baselines_df, \"sentiment_baselines\")\n        if viral_thresholds_df:\n            self._write_to_silver(viral_thresholds_df, \"viral_thresholds\")\n        if movie_intelligence_df:\n            self._write_to_silver(movie_intelligence_df, \"movie_intelligence\")\n        \n        # Log metrics\n        self.metrics.log(logger)\n        logger.info(\"Multi-goal baseline calculation completed successfully\")\n    \n    def _load_bronze_movies(self) -> Optional[DataFrame]:\n        \"\"\"Load movies from Bronze layer.\"\"\"\n        try:\n            bronze_path = get_bronze_path(\"tmdb_movies\", None).rstrip('/')\n            logger.info(f\"Loading movies from Bronze: {bronze_path}\")\n            \n            df = self.spark.read.parquet(bronze_path)\n            count = df.count()\n            \n            logger.info(f\"Loaded {count} movies from Bronze\")\n            self.metrics.add_metric(\"bronze_movies_loaded\", count)\n            \n            return df if count > 0 else None\n            \n        except Exception as e:\n            logger.error(f\"Failed to load Bronze movies: {str(e)}\", exc_info=True)\n            return None\n    \n    def _load_bronze_reviews(self) -> Optional[DataFrame]:\n        \"\"\"Load reviews from Bronze layer.\"\"\"\n        try:\n            bronze_path = get_bronze_path(\"tmdb_reviews\", None).rstrip('/')\n            logger.info(f\"Loading reviews from Bronze: {bronze_path}\")\n            \n            df = self.spark.read.parquet(bronze_path)\n            count = df.count()\n            \n            logger.info(f\"Loaded {count} reviews from Bronze\")\n            self.metrics.add_metric(\"bronze_reviews_loaded\", count)\n            \n            return df if count > 0 else None\n            \n        except Exception as e:\n            logger.warning(f\"No reviews found in Bronze (optional for baselines): {str(e)}\")\n            return None\n    \n    def _load_bronze_genres(self) -> Optional[DataFrame]:\n        \"\"\"Load genres from Bronze layer.\"\"\"\n        try:\n            bronze_path = get_bronze_path(\"tmdb_genres\", None).rstrip('/')\n            logger.info(f\"Loading genres from Bronze: {bronze_path}\")\n            \n            df = self.spark.read.parquet(bronze_path)\n            count = df.count()\n            \n            logger.info(f\"Loaded {count} genres from Bronze\")\n            self.metrics.add_metric(\"bronze_genres_loaded\", count)\n            \n            return df if count > 0 else None\n            \n        except Exception as e:\n            logger.error(f\"Failed to load Bronze genres: {str(e)}\", exc_info=True)\n            return None\n    \n    def _enrich_movies(\n        self,\n        movies_df: DataFrame,\n        reviews_df: Optional[DataFrame],\n        genres_df: DataFrame\n    ) -> Optional[DataFrame]:\n        \"\"\"\n        Enrich movies with derived fields for business goals.\n        \n        Adds:\n        - genre_names: Array of genre names (not just IDs)\n        - primary_genre: First genre for categorization\n        - franchise: From belongs_to_collection\n        - director: From credits (if available)\n        - budget_tier: indie/mid/blockbuster classification\n        - release_month, release_year: Temporal fields\n        - avg_sentiment: Movie-level sentiment from reviews\n        \"\"\"\n        logger.info(\"Enriching movies with derived fields\")\n        \n        try:\n            # Join with genres to get genre names\n            genre_map = genres_df.select(\n                F.col(\"id\").alias(\"genre_id\"),\n                F.col(\"name\").alias(\"genre_name\")\n            )\n            \n            # Create genre_names array from genre_ids\n            # Note: This requires exploding and collecting, which is expensive\n            # For simplicity, we'll use the first genre as primary\n            enriched = movies_df.withColumn(\n                \"primary_genre_id\",\n                F.when(F.size(F.col(\"genre_ids\")) > 0, F.col(\"genre_ids\")[0])\n                .otherwise(F.lit(None))\n            )\n            \n            enriched = enriched.join(\n                genre_map.select(\n                    F.col(\"genre_id\").alias(\"primary_genre_id\"),\n                    F.col(\"genre_name\").alias(\"primary_genre\")\n                ),\n                on=\"primary_genre_id\",\n                how=\"left\"\n            )\n            \n            # Extract franchise from belongs_to_collection (if available)\n            # Note: Bronze layer now stores collection name directly as string\n            if \"belongs_to_collection\" in enriched.columns:\n                enriched = enriched.withColumnRenamed(\"belongs_to_collection\", \"franchise\")\n            else:\n                logger.warning(\"belongs_to_collection field not available - franchise will be null\")\n                enriched = enriched.withColumn(\"franchise\", F.lit(None).cast(StringType()))\n            \n            # Classify budget tier (handle missing budget field)\n            if \"budget\" in enriched.columns:\n                enriched = enriched.withColumn(\n                    \"budget_tier\",\n                    F.when(F.col(\"budget\") >= self.BUDGET_TIERS['blockbuster'][0], \"blockbuster\")\n                    .when(F.col(\"budget\") >= self.BUDGET_TIERS['mid'][0], \"mid\")\n                    .when(F.col(\"budget\") > 0, \"indie\")\n                    .otherwise(F.lit(\"unknown\"))\n                )\n            else:\n                logger.warning(\"budget field not available - budget_tier will be unknown\")\n                enriched = enriched.withColumn(\"budget_tier\", F.lit(\"unknown\"))\n                enriched = enriched.withColumn(\"budget\", F.lit(0))\n            \n            # Extract temporal fields\n            enriched = enriched.withColumn(\n                \"release_year\",\n                F.year(F.col(\"release_date\"))\n            ).withColumn(\n                \"release_month\",\n                F.month(F.col(\"release_date\"))\n            ).withColumn(\n                \"release_month_name\",\n                F.date_format(F.col(\"release_date\"), \"MMMM\")\n            )\n            \n            # Map month to season\n            enriched = enriched.withColumn(\n                \"season\",\n                F.when(F.col(\"release_month\").isin([12, 1, 2]), \"winter\")\n                .when(F.col(\"release_month\").isin([3, 4, 5]), \"spring\")\n                .when(F.col(\"release_month\").isin([6, 7, 8]), \"summer\")\n                .when(F.col(\"release_month\").isin([9, 10, 11]), \"fall\")\n                .otherwise(F.lit(\"unknown\"))\n            )\n            \n            # Extract director from credits if available\n            # Note: TMDB API includes crew in separate endpoint - not in basic movie data\n            if \"director\" in enriched.columns:\n                # Field exists, use it\n                pass\n            else:\n                logger.warning(\"director field not available - will be null (requires detailed movie API call)\")\n                enriched = enriched.withColumn(\"director\", F.lit(None).cast(StringType()))\n            \n            # Calculate movie-level sentiment from reviews\n            if reviews_df is not None:\n                logger.info(\"Calculating movie-level sentiment from reviews\")\n                \n                reviews_with_sentiment = reviews_df.select(\n                    F.col(\"movie_id\"),\n                    F.expr(\"sentiment_score(content)\").alias(\"sentiment_score\")\n                )\n                \n                movie_sentiments = reviews_with_sentiment.groupBy(\"movie_id\").agg(\n                    F.avg(\"sentiment_score\").alias(\"avg_sentiment\"),\n                    F.count(\"*\").alias(\"review_count\")\n                )\n                \n                enriched = enriched.join(\n                    movie_sentiments,\n                    enriched.id == movie_sentiments.movie_id,\n                    how=\"left\"\n                ).drop(\"movie_id\")\n            else:\n                # Use vote_average as sentiment proxy\n                logger.warning(\"No reviews - using rating as sentiment proxy\")\n                enriched = enriched.withColumn(\n                    \"avg_sentiment\",\n                    (F.col(\"vote_average\") - 5) / 5  # Normalize to -1 to 1\n                ).withColumn(\n                    \"review_count\",\n                    F.lit(0)\n                )\n            \n            # Fill nulls\n            enriched = enriched.fillna({\n                \"avg_sentiment\": 0.0,\n                \"review_count\": 0,\n                \"budget\": 0,\n                \"popularity\": 0.0\n            })\n            \n            count = enriched.count()\n            logger.info(f\"Enriched {count} movies with derived fields\")\n            self.metrics.add_metric(\"movies_enriched\", count)\n            \n            return enriched\n            \n        except Exception as e:\n            logger.error(f\"Failed to enrich movies: {str(e)}\", exc_info=True)\n            return None\n    \n    def _generate_sentiment_baselines(self, enriched_movies_df: DataFrame) -> Optional[DataFrame]:\n        \"\"\"\n        Generate sentiment baselines for Business Goal #1: PR Crisis Detection.\n        \n        Produces genre/franchise/director/temporal sentiment patterns.\n        \n        CRITICAL FIX: Filters out movies with no reviews (review_count=0 or avg_sentiment=0)\n        to prevent zero-sentiment movies from compressing baselines and causing scale mismatch\n        with speed layer sentiments.\n        \"\"\"\n        logger.info(\"Generating sentiment baselines for Goal #1\")\n        \n        try:\n            # FILTER: Only include movies with actual reviews to prevent baseline compression\n            # Movies with review_count=0 or avg_sentiment=0.0 dilute baselines by ~1000x\n            movies_with_reviews = enriched_movies_df.filter(\n                (F.col(\"review_count\") > 0) & (F.col(\"avg_sentiment\") != 0.0)\n            )\n            \n            movies_before = enriched_movies_df.count()\n            movies_after = movies_with_reviews.count()\n            logger.info(f\"Filtered movies: {movies_before} -> {movies_after} (removed {movies_before - movies_after} with no reviews)\")\n            \n            # Genre-level baselines\n            genre_baselines = movies_with_reviews.groupBy(\"primary_genre\").agg(\n                F.avg(\"avg_sentiment\").alias(\"avg_sentiment\"),\n                F.stddev(\"avg_sentiment\").alias(\"sentiment_stddev\"),\n                F.count(\"*\").alias(\"movie_count\"),\n                F.sum(\"review_count\").alias(\"review_count\")\n            ).select(\n                F.col(\"primary_genre\"),\n                F.col(\"avg_sentiment\"),\n                F.col(\"sentiment_stddev\"),\n                F.col(\"movie_count\"),\n                F.col(\"review_count\"),\n                F.lit(None).cast(StringType()).alias(\"franchise\"),\n                F.lit(None).cast(DoubleType()).alias(\"franchise_avg_sentiment\"),\n                F.lit(None).cast(IntegerType()).alias(\"year\"),\n                F.lit(None).cast(DoubleType()).alias(\"yearly_sentiment\")\n            )\n            \n            # Franchise-level baselines (franchise dimension only, genre=null)\n            franchise_baselines = movies_with_reviews.filter(\n                F.col(\"franchise\").isNotNull()\n            ).groupBy(\"franchise\").agg(\n                F.avg(\"avg_sentiment\").alias(\"franchise_avg_sentiment\"),\n                F.stddev(\"avg_sentiment\").alias(\"sentiment_stddev\"),\n                F.count(\"*\").alias(\"movie_count\"),\n                F.sum(\"review_count\").alias(\"review_count\")\n            ).select(\n                F.lit(None).cast(StringType()).alias(\"primary_genre\"),\n                F.col(\"franchise_avg_sentiment\").alias(\"avg_sentiment\"),\n                F.col(\"sentiment_stddev\"),\n                F.col(\"movie_count\"),\n                F.col(\"review_count\"),\n                F.col(\"franchise\"),\n                F.col(\"franchise_avg_sentiment\"),\n                F.lit(None).cast(IntegerType()).alias(\"year\"),\n                F.lit(None).cast(DoubleType()).alias(\"yearly_sentiment\")\n            )\n            \n            # Year-level baselines (year dimension only, genre=null)\n            yearly_baselines = movies_with_reviews.filter(\n                F.col(\"release_year\").isNotNull()\n            ).groupBy(\"release_year\").agg(\n                F.avg(\"avg_sentiment\").alias(\"yearly_sentiment\"),\n                F.stddev(\"avg_sentiment\").alias(\"sentiment_stddev\"),\n                F.count(\"*\").alias(\"movie_count\"),\n                F.sum(\"review_count\").alias(\"review_count\")\n            ).select(\n                F.lit(None).cast(StringType()).alias(\"primary_genre\"),\n                F.col(\"yearly_sentiment\").alias(\"avg_sentiment\"),\n                F.col(\"sentiment_stddev\"),\n                F.col(\"movie_count\"),\n                F.col(\"review_count\"),\n                F.lit(None).cast(StringType()).alias(\"franchise\"),\n                F.lit(None).cast(DoubleType()).alias(\"franchise_avg_sentiment\"),\n                F.col(\"release_year\").alias(\"year\"),\n                F.col(\"yearly_sentiment\")\n            )\n            \n            # Union all baselines\n            sentiment_baselines = genre_baselines.union(franchise_baselines).union(yearly_baselines)\n            \n            # Add metadata\n            sentiment_baselines = sentiment_baselines \\\n                .withColumn(\"type\", F.lit(\"sentiment_baseline\")) \\\n                .withColumn(\"updated_at\", F.current_timestamp()) \\\n                .withColumnRenamed(\"primary_genre\", \"genre\") \\\n                .fillna({\n                    \"avg_sentiment\": 0.0,\n                    \"sentiment_stddev\": 0.1,\n                    \"review_count\": 0\n                })\n            \n            count = sentiment_baselines.count()\n            logger.info(f\"Generated {count} sentiment baseline records\")\n            self.metrics.add_metric(\"sentiment_baselines_generated\", count)\n            \n            return sentiment_baselines\n            \n        except Exception as e:\n            logger.error(f\"Failed to generate sentiment baselines: {str(e)}\", exc_info=True)\n            return None\n    \n    def _generate_viral_thresholds(self, enriched_movies_df: DataFrame) -> Optional[DataFrame]:\n        \"\"\"\n        Generate viral thresholds for Business Goal #2: Viral Content Identification.\n        \n        Produces genre/budget-tier/seasonal viral cutoffs.\n        \"\"\"\n        logger.info(\"Generating viral thresholds for Goal #2\")\n        \n        try:\n            # Genre-level thresholds (99th percentile for viral, not 75th)\n            genre_thresholds = enriched_movies_df.groupBy(\"primary_genre\").agg(\n                F.expr(\"percentile_approx(vote_count, 0.99)\").alias(\"viral_threshold\"),\n                F.avg(\"popularity\").alias(\"avg_popularity\"),\n                F.count(\"*\").alias(\"movie_count\")\n            ).select(\n                F.col(\"primary_genre\"),\n                F.col(\"viral_threshold\").cast(IntegerType()),\n                F.col(\"avg_popularity\"),\n                F.col(\"movie_count\"),\n                F.lit(None).cast(StringType()).alias(\"budget_tier\"),\n                F.lit(None).cast(IntegerType()).alias(\"budget_tier_threshold\"),\n                F.lit(None).cast(DoubleType()).alias(\"budget_tier_coefficient\"),\n                F.lit(None).cast(StringType()).alias(\"season\"),\n                F.lit(None).cast(IntegerType()).alias(\"seasonal_threshold\")\n            )\n            \n            # Budget tier thresholds (budget dimension only, genre=null)\n            budget_thresholds = enriched_movies_df.filter(\n                F.col(\"budget_tier\") != \"unknown\"\n            ).groupBy(\"budget_tier\").agg(\n                F.expr(\"percentile_approx(vote_count, 0.99)\").alias(\"budget_tier_threshold\"),\n                F.expr(\"percentile_approx(vote_count, 0.99)\").alias(\"viral_threshold\"),\n                F.avg(\"popularity\").alias(\"avg_popularity\"),\n                F.count(\"*\").alias(\"movie_count\")\n            ).select(\n                F.lit(None).cast(StringType()).alias(\"primary_genre\"),\n                F.col(\"viral_threshold\").cast(IntegerType()),\n                F.col(\"avg_popularity\"),\n                F.col(\"movie_count\"),\n                F.col(\"budget_tier\"),\n                F.col(\"budget_tier_threshold\"),\n                F.lit(2.5).cast(DoubleType()).alias(\"budget_tier_coefficient\"),  # Hardcoded breakout multiplier\n                F.lit(None).cast(StringType()).alias(\"season\"),\n                F.lit(None).cast(IntegerType()).alias(\"seasonal_threshold\")\n            )\n            \n            # Seasonal thresholds (season dimension only, genre=null)\n            seasonal_thresholds = enriched_movies_df.filter(\n                F.col(\"season\") != \"unknown\"\n            ).groupBy(\"season\").agg(\n                F.expr(\"percentile_approx(vote_count, 0.99)\").alias(\"seasonal_threshold\"),\n                F.expr(\"percentile_approx(vote_count, 0.99)\").alias(\"viral_threshold\"),\n                F.avg(\"popularity\").alias(\"avg_popularity\"),\n                F.count(\"*\").alias(\"movie_count\")\n            ).select(\n                F.lit(None).cast(StringType()).alias(\"primary_genre\"),\n                F.col(\"viral_threshold\").cast(IntegerType()),\n                F.col(\"avg_popularity\"),\n                F.col(\"movie_count\"),\n                F.lit(None).cast(StringType()).alias(\"budget_tier\"),\n                F.lit(None).cast(IntegerType()).alias(\"budget_tier_threshold\"),\n                F.lit(None).cast(DoubleType()).alias(\"budget_tier_coefficient\"),\n                F.col(\"season\"),\n                F.col(\"seasonal_threshold\")\n            )\n            \n            # Union all thresholds\n            viral_thresholds = genre_thresholds.union(budget_thresholds).union(seasonal_thresholds)\n            \n            # Add metadata\n            viral_thresholds = viral_thresholds \\\n                .withColumn(\"type\", F.lit(\"viral_threshold\")) \\\n                .withColumn(\"updated_at\", F.current_timestamp()) \\\n                .withColumnRenamed(\"primary_genre\", \"genre\")\n            \n            count = viral_thresholds.count()\n            logger.info(f\"Generated {count} viral threshold records\")\n            self.metrics.add_metric(\"viral_thresholds_generated\", count)\n            \n            return viral_thresholds\n            \n        except Exception as e:\n            logger.error(f\"Failed to generate viral thresholds: {str(e)}\", exc_info=True)\n            return None\n    \n    def _generate_movie_intelligence(self, enriched_movies_df: DataFrame) -> Optional[DataFrame]:\n        \"\"\"\n        Generate movie intelligence for Business Goal #3: Competitive Intelligence.\n        \n        Produces individual movie records with competitive context.\n        \"\"\"\n        logger.info(\"Generating movie intelligence for Goal #3\")\n        \n        try:\n            # Select relevant fields for movie intelligence\n            # Handle potentially missing fields\n            select_fields = [\n                F.col(\"id\").alias(\"movie_id\"),\n                F.col(\"title\"),\n                F.array(F.col(\"primary_genre\")).alias(\"genre\"),  # Array for consistency\n                F.col(\"release_date\"),\n                F.col(\"release_month_name\").alias(\"release_month\"),\n                F.col(\"release_year\"),\n                F.col(\"avg_sentiment\"),\n                F.col(\"vote_average\"),\n                F.col(\"vote_count\"),\n                F.col(\"popularity\"),\n                F.col(\"budget\"),\n                F.col(\"budget_tier\"),\n                F.col(\"franchise\"),\n                F.col(\"director\")\n            ]\n            \n            # Add runtime if available\n            if \"runtime\" in enriched_movies_df.columns:\n                select_fields.append(F.col(\"runtime\"))\n            else:\n                select_fields.append(F.lit(None).cast(IntegerType()).alias(\"runtime\"))\n            \n            select_fields.append(F.col(\"review_count\"))\n            \n            movie_intelligence = enriched_movies_df.select(*select_fields)\n            \n            # Add metadata\n            movie_intelligence = movie_intelligence \\\n                .withColumn(\"type\", F.lit(\"movie_intelligence\")) \\\n                .withColumn(\"updated_at\", F.current_timestamp())\n            \n            count = movie_intelligence.count()\n            logger.info(f\"Generated {count} movie intelligence records\")\n            self.metrics.add_metric(\"movie_intelligence_generated\", count)\n            \n            return movie_intelligence\n            \n        except Exception as e:\n            logger.error(f\"Failed to generate movie intelligence: {str(e)}\", exc_info=True)\n            return None\n    \n    def _write_to_silver(self, df: DataFrame, dataset_name: str):\n        \"\"\"Write dataset to Silver layer.\"\"\"\n        try:\n            output_path = get_silver_path(dataset_name, None).rstrip('/')\n            \n            logger.info(f\"Writing {dataset_name} to Silver layer: {output_path}\")\n            \n            df.write \\\n                .mode(\"overwrite\") \\\n                .parquet(output_path)\n            \n            count = df.count()\n            logger.info(f\"Successfully wrote {count} records to {dataset_name}\")\n            self.metrics.add_metric(f\"{dataset_name}_written\", count)\n            \n        except Exception as e:\n            logger.error(f\"Failed to write {dataset_name} to Silver: {str(e)}\", exc_info=True)\n            raise\n\n\ndef main():\n    \"\"\"Main entry point for multi-goal baseline calculation job.\"\"\"\n    parser = argparse.ArgumentParser(description=\"Silver Layer Multi-Goal Baseline Calculation\")\n    \n    args = parser.parse_args()\n    \n    spark = None\n    try:\n        # Create Spark session\n        spark = get_spark_session(\"multi_goal_baseline_calculation\")\n        \n        # Run baseline calculation\n        job = BaselineCalculationJob(spark)\n        job.run()\n        \n    except Exception as e:\n        logger.error(f\"Multi-goal baseline calculation failed: {str(e)}\", exc_info=True)\n        sys.exit(1)\n    \n    finally:\n        if spark:\n            stop_spark_session(spark)\n\n\nif __name__ == \"__main__\":\n    main()\n"
