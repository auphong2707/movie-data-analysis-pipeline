apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: serving-mongodb
  name: serving-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: serving-mongodb
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: serving-mongodb
    spec:
      containers:
        - env:
            - name: MONGO_INITDB_DATABASE
              value: moviedb
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: password
            - name: MONGO_INITDB_ROOT_USERNAME
              value: admin
          image: mongo:7.0
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - db.adminCommand('ping')
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 10
          name: serving-mongodb
          ports:
            - containerPort: 27017
              protocol: TCP
          volumeMounts:
            - mountPath: /data/db
              name: serving-mongodb-data
      hostname: mongodb
      restartPolicy: Always
      volumes:
        - name: serving-mongodb-data
          persistentVolumeClaim:
            claimName: serving-mongodb-data
