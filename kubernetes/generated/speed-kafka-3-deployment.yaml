apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: speed-kafka-3
  name: speed-kafka-3
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: speed-kafka-3
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: speed-kafka-3
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - env:
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://speed-kafka-3:9094
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9094
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_BROKER_ID
              value: "3"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_DELETE_TOPIC_ENABLE
              value: "true"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT
            - name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS
              value: "300000"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "1073741824"
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "2097152"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: speed-zookeeper:2181
            - name: KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS
              value: "18000"
            - name: KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS
              value: "18000"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/kafka-logs
          image: confluentinc/cp-kafka:7.4.0
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - kafka-broker-api-versions --bootstrap-server localhost:9094 2>&1 | grep -q ApiVersion || exit 1
            failureThreshold: 30
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
          name: speed-kafka-3
          ports:
            - containerPort: 9094
              protocol: TCP
            - containerPort: 9103
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/kafka/data
              name: speed-kafka-broker3-data
      hostname: kafka-3
      restartPolicy: Always
      volumes:
        - name: speed-kafka-broker3-data
          persistentVolumeClaim:
            claimName: speed-kafka-broker3-data
