apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: serving-mongodb-exporter
  name: serving-mongodb-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: serving-mongodb-exporter
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: serving-mongodb-exporter
    spec:
      containers:
        - env:
            - name: MONGODB_URI
              value: mongodb://admin:password@mongodb:27017
          image: bitnami/mongodb-exporter:latest
          name: serving-mongodb-exporter
          ports:
            - containerPort: 9216
              protocol: TCP
      restartPolicy: Always
