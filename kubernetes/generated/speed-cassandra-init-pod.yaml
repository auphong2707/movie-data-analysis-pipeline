apiVersion: v1
kind: Pod
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: speed-cassandra-init
  name: speed-cassandra-init
spec:
  containers:
    - args:
        - bash
        - -c
        - |2
            echo 'Waiting for Cassandra to be fully ready...' &&
            sleep 10 &&
            echo 'Initializing Cassandra schema...' &&
            cqlsh speed-cassandra -f /schema.cql &&
            echo 'Schema initialized successfully!'
      image: cassandra:4.1
      name: speed-cassandra-init
      volumeMounts:
        - mountPath: /schema.cql
          name: speed-cassandra-init-cm0
          subPath: schema.cql
  restartPolicy: Never
  volumes:
    - configMap:
        items:
          - key: reddit_schema.cql
            path: schema.cql
        name: speed-cassandra-init-cm0
      name: speed-cassandra-init-cm0
