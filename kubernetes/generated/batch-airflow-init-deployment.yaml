apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: batch-airflow-init
  name: batch-airflow-init
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: batch-airflow-init
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o kubernetes/generated/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: batch-airflow-init
    spec:
      containers:
        - args:
            - -c
            - |
              airflow db migrate
              airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
          command:
            - /bin/bash
          env:
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__FERNET_KEY
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:airflow@batch-postgres/airflow
            - name: _AIRFLOW_DB_MIGRATE
              value: "true"
            - name: _AIRFLOW_WWW_USER_CREATE
              value: "true"
            - name: _AIRFLOW_WWW_USER_PASSWORD
              value: admin
            - name: _AIRFLOW_WWW_USER_USERNAME
              value: admin
          image: apache/airflow:2.7.3-python3.11
          name: batch-airflow-init
      restartPolicy: Always
